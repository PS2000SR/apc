/* ---- Analytics: Auswertung der Feedbacks (Belastung, Spass, Schmerzen, Trainings pro Woche) ---- */
function openAnalytics(){
  Voice.stop();
  const DAY = 864e5, now = Date.now();
  const log = (progress.log || []).slice().sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
  const fbl = log.filter(e => e.fb && e.fb.strain), last = fbl.slice(-20);
  const pains = painList().slice().sort((a, b) => Date.parse(a.at) - Date.parse(b.at)), p30 = pains.filter(r => now - Date.parse(r.at) < 30 * DAY);
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  const aS = avg(last.map(e => e.fb.strain)), aF = avg(last.filter(e => e.fb.fun).map(e => e.fb.fun));
  const fd = t => new Date(t).toLocaleDateString('de-CH', { day:'numeric', month:'numeric' });
  const mName = id => { const m = MISSIONS.find(x => x.id === id); return m ? m.title : id; };
  const FUN = ['Ging so', 'Okay', 'Mega'];

  // 1) Verlauf Belastung (Balken) und Spass (Linie) der letzten 20 Trainings
  let trend = '<p class="an-empty">Noch keine Feedbacks. Nach jedem Training erscheinen hier Belastung und Spass.</p>';
  if (last.length){
    const W = 600, H = 200, pl = 34, pb = 26, cw = (W - pl - 10) / Math.max(last.length, 1), bw = Math.min(26, cw * .62), y = v => H - pb - (v / 5) * (H - pb - 14);
    const grid = [1, 2, 3, 4, 5].map(v => `<line x1="${pl}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 8}" y="${y(v) + 4}" fill="var(--muted)" font-size="11" text-anchor="end">${v}</text>`).join('');
    const bars = last.map((e, k) => { const x = pl + k * cw + (cw - bw) / 2, v = e.fb.strain; return `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - pb - y(v)).toFixed(1)}" rx="3" fill="${STRAIN[v - 1][1]}"><title>${fd(e.at)} · ${mName(e.mission)} · ${STRAIN[v - 1][0]}${e.fb.fun ? ' · Spass: ' + FUN[e.fb.fun - 1] : ''}</title></rect>`; }).join('');
    const pts = last.map((e, k) => e.fb.fun ? [pl + k * cw + cw / 2, y(e.fb.fun * 5 / 3)] : null).filter(Boolean);
    const line = pts.length > 1 ? `<polyline points="${pts.map(q => q.map(n => n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--ice)" stroke-width="2.5" stroke-linejoin="round"/>` : '';
    const dots = pts.map(q => `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4" fill="var(--ice)"/>`).join('');
    const pain = last.map((e, k) => e.fb.pain ? `<text x="${(pl + k * cw + cw / 2).toFixed(1)}" y="${H - 8}" fill="var(--red)" font-size="14" font-weight="800" text-anchor="middle">!</text>` : '').join('');
    trend = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Belastung und Spass der letzten ${last.length} Trainings">${grid}${bars}${line}${dots}${pain}</svg>
      <div class="an-legend"><span><i style="background:${STRAIN[3][1]}"></i>Belastung (1 Locker – 5 Hammer)</span><span><i style="background:var(--ice)"></i>Spass</span><span><b style="color:var(--red)">!</b> Schmerz gemeldet</span></div>`;
  }

  // 2) Trainings pro Woche (letzte 8 Wochen) mit Wochenziel
  const wk0 = weekStart(new Date().toISOString()), weeks = [];
  for (let k = 7; k >= 0; k--){ const ws = weekStart(new Date(wk0 - k * 7 * DAY + DAY).toISOString()); weeks.push({ ws, n:log.filter(e => weekStart(e.at) === ws).length, pause:!!(progress.pauseWeeks || {})[ws] }); }
  const maxN = Math.max(weekTarget(), ...weeks.map(w => w.n), 1);
  const WW = 600, WH = 170, wb = 24, wy = v => WH - wb - (v / maxN) * (WH - wb - 14), wcw = (WW - 20) / 8;
  const weekSVG = `<svg viewBox="0 0 ${WW} ${WH}" role="img" aria-label="Trainings pro Woche">
    <line x1="10" x2="${WW - 10}" y1="${wy(weekTarget())}" y2="${wy(weekTarget())}" stroke="var(--gold)" stroke-dasharray="6 5" stroke-width="1.5"/>
    ${weeks.map((w, k) => { const x = 10 + k * wcw + wcw * .2, bwid = wcw * .6;
      return `${w.n ? `<rect x="${x.toFixed(1)}" y="${wy(w.n).toFixed(1)}" width="${bwid.toFixed(1)}" height="${(WH - wb - wy(w.n)).toFixed(1)}" rx="4" fill="${w.n >= weekTarget() ? 'var(--ok)' : 'var(--ice)'}"/>` : ''}
        <text x="${(x + bwid / 2).toFixed(1)}" y="${(w.n ? wy(w.n) - 6 : WH - wb - 6).toFixed(1)}" fill="var(--text)" font-size="13" text-anchor="middle">${w.n}${w.pause ? ' · Pause' : ''}</text>
        <text x="${(x + bwid / 2).toFixed(1)}" y="${WH - 6}" fill="var(--muted)" font-size="11" text-anchor="middle">${k === 7 ? 'Diese' : fd(w.ws)}</text>`; }).join('')}</svg>
    <div class="an-legend"><span><i style="background:var(--ok)"></i>Wochenziel erreicht</span><span><i style="background:var(--gold)"></i>Wochenziel (${weekTarget()})</span></div>`;

  // 3) Schmerzen nach Körperstelle (90 Tage)
  const p90 = pains.filter(r => now - Date.parse(r.at) < 90 * DAY), byArea = {};
  p90.forEach(r => { const a = byArea[r.area] = byArea[r.area] || { n:0, stark:0 }; a.n++; if (r.level === 'stark') a.stark++; });
  const maxA = Math.max(1, ...Object.values(byArea).map(a => a.n));
  const painHTML = p90.length ? `<div class="an-bars">${Object.keys(byArea).sort((a, b) => byArea[b].n - byArea[a].n).map(id => `<div class="an-bar"><span>${painInfo(id).label}</span><div><span style="width:${byArea[id].n / maxA * 100}%;background:${byArea[id].stark ? 'var(--red)' : 'var(--gold)'}"></span></div><b>${byArea[id].n}×</b></div>`).join('')}</div>
      <div class="an-legend"><span><i style="background:var(--gold)"></i>nur «zwickt»</span><span><i style="background:var(--red)"></i>mindestens einmal «tut richtig weh»</span></div>
      <p class="muted">Letzte Meldung: ${fd(pains[pains.length - 1].at)} · ${painInfo(pains[pains.length - 1].area).label} · ${pains[pains.length - 1].level === 'stark' ? 'tut richtig weh' : 'zwickt'}</p>`
    : '<p class="an-empty">In den letzten 90 Tagen keine Schmerzen gemeldet.</p>';

  // 4) Spass nach Trainings-Set
  const byM = {}; fbl.filter(e => e.fb.fun).forEach(e => { const m = byM[e.mission] = byM[e.mission] || { s:0, n:0, st:0 }; m.s += e.fb.fun; m.st += e.fb.strain; m.n++; });
  const mRows = Object.entries(byM).map(([id, m]) => ({ id, fun:m.s / m.n, strain:m.st / m.n, n:m.n })).sort((a, b) => b.fun - a.fun || b.n - a.n);
  const funHTML = mRows.length ? `<div class="an-bars">${mRows.slice(0, 8).map(r => `<div class="an-bar"><span title="${mName(r.id)}">${mName(r.id)}</span><div><span style="width:${(r.fun / 3 * 100).toFixed(0)}%;background:var(--ice)"></span></div><b>${r.fun >= 2.5 ? 'Mega' : r.fun >= 1.75 ? 'Okay' : 'Ging so'}</b></div>`).join('')}</div><p class="muted">Durchschnitt pro Set, ${mRows.length > 8 ? 'die 8 beliebtesten' : 'alle bewerteten Sets'}.</p>`
    : '<p class="an-empty">Noch keine Bewertungen.</p>';

  // 5) Hinweise
  const hints = [];
  const l3 = fbl.slice(-3);
  if (l3.length === 3 && l3.every(e => e.fb.strain >= 4)) hints.push('Die letzten 3 Trainings waren «Streng» oder «Hammer». Ein lockerer Tag dazwischen tut gut.');
  if (aS !== null && aS <= 2 && fbl.length >= 5) hints.push('Die Trainings wirken eher locker. Es darf ruhig mal ein Set mit hoher Belastung sein.');
  Object.entries(byArea).forEach(([id, a]) => { if (a.n >= 3) hints.push(`${painInfo(id).label}: ${a.n} Meldungen in 90 Tagen. Das sollte sich eine Fachperson anschauen.`); });
  if (progress.painPause) hints.push(`Pausenmodus aktiv (${painInfo(progress.painPause.area).label}). Freigabe im Eltern-Bereich.`);
  const lowFun = mRows.filter(r => r.n >= 2 && r.fun < 1.75); if (lowFun.length) hints.push(`Wenig Spass bei: ${lowFun.map(r => mName(r.id)).join(', ')}.`);
  if (!hints.length) hints.push(fbl.length ? 'Alles im grünen Bereich – weiter so!' : 'Sobald ein paar Feedbacks da sind, erscheinen hier Hinweise.');

  $('screen-analytics').innerHTML = `
  <div class="inner trophies hub">
    <div class="tr-head"><div><p class="eyebrow">Fortschritt</p><h1>Analytics</h1></div>
      <button class="btn btn-ghost btn-small" id="btn-an-back"><span class="arrow back" aria-hidden="true"></span> Fortschritt</button></div>
    <div class="stats">
      <div class="stat"><small>Feedbacks</small><b>${fbl.length}</b></div>
      <div class="stat"><small>Ø Belastung (letzte 20)</small><b>${aS === null ? '–' : STRAIN[Math.round(aS) - 1][0]}<em>${aS === null ? '' : ' ' + aS.toFixed(1)}</em></b></div>
      <div class="stat"><small>Ø Spass (letzte 20)</small><b>${aF === null ? '–' : FUN[Math.round(aF) - 1]}</b></div>
    </div>
    <section class="an-box"><p class="eyebrow">Hinweise</p><ul class="an-hints">${hints.map(h => `<li>${h}</li>`).join('')}</ul></section>
    <section class="an-box"><p class="eyebrow">Verlauf</p><h3>Belastung und Spass</h3>${trend}</section>
    <section class="an-box"><p class="eyebrow">Regelmässigkeit</p><h3>Trainings pro Woche</h3>${weekSVG}</section>
    <section class="an-box"><p class="eyebrow">Schmerzen · 90 Tage</p><h3>Nach Körperstelle</h3>${painHTML}<p class="muted">${p30.length} Meldungen in den letzten 30 Tagen.</p></section>
    <section class="an-box"><p class="eyebrow">Spass</p><h3>Beliebteste Sets</h3>${funHTML}</section>
  </div>`;
  $('btn-an-back').onclick = openProgress;
  show('analytics');
}

/* ---- Eltern: Bericht mit PDF-Export ----
   Wertet die lokalen Daten (Trainings, Feedback, Schmerzen, Rekorde, Abzeichen) für einen Zeitraum aus.
   PDF über die Druckfunktion des Geräts (iPad: im Druckfenster Teilen → «In Dateien sichern»). Es wird nichts übertragen. */
const reportState = Object.assign({ range:'month', from:'', to:'', note:'' }, store.get('apc.report.v1', {}));
const saveReport = () => store.set('apc.report.v1', { range:reportState.range, from:reportState.from, to:reportState.to, note:reportState.note });
const RP_RANGES = [ ['7d','Letzte 7 Tage'], ['month','Dieser Monat'], ['prev','Letzter Monat'], ['3m','Letzte 3 Monate'], ['all','Gesamte Zeit'], ['custom','Eigener Zeitraum'] ];
const RP_C = { navy:'#0B1F3A', ice:'#2A7DE1', iceL:'#E8F1FC', grey:'#5B6573', line:'#D9DEE5', soft:'#F3F5F8', ok:'#1E9E6A', warn:'#E08A00', red:'#D64545', warnL:'#FDF3E3' };
const rpEsc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const rpDate = (t, o) => new Date(t).toLocaleDateString('de-CH', o || { day:'2-digit', month:'2-digit', year:'numeric' });
const rpDay0 = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d; };
const rpParse = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const rpISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

function reportRange(){
  const now = new Date(), today = rpDay0(now), y = now.getFullYear(), m = now.getMonth();
  let from = new Date(y, m, 1), to = new Date(today.getTime() + 864e5 - 1);
  switch (reportState.range){
    case '7d': from = new Date(today.getTime() - 6 * 864e5); break;
    case 'prev': from = new Date(y, m - 1, 1); to = new Date(new Date(y, m, 1).getTime() - 1); break;
    case '3m': from = new Date(y, m - 2, 1); break;
    case 'all': {
      const ts = (progress.log || []).map(e => Date.parse(e.at)).concat(painList().map(r => Date.parse(r.at))).filter(x => !isNaN(x));
      from = ts.length ? rpDay0(Math.min(...ts)) : today; break; }
    case 'custom': {
      const f = rpParse(reportState.from), t = rpParse(reportState.to);
      if (f) from = f; if (t) to = new Date(t.getTime() + 864e5 - 1);
      if (from > to){ const x = rpDay0(to); to = new Date(from.getTime() + 864e5 - 1); from = x; }
      break; }
  }
  return { from, to };
}

function reportData(from, to){
  const F = from.getTime(), T = to.getTime(), len = T - F + 1, PF = F - len;
  const inR = t => { const x = Date.parse(t); return x >= F && x <= T; }, inP = t => { const x = Date.parse(t); return x >= PF && x < F; };
  const byTime = (a, b) => Date.parse(a.at) - Date.parse(b.at);
  const all = (progress.log || []).slice().sort(byTime);
  const log = all.filter(e => inR(e.at)), prev = all.filter(e => inP(e.at));
  const sum = a => a.reduce((s, e) => s + (e.dur || 0), 0);
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  // Tage mit Training und längste Serie an Tagen in Folge
  const dayMin = {}; log.forEach(e => { const k = rpDay0(e.at).getTime(); dayMin[k] = (dayMin[k] || 0) + (e.dur || 0); });
  let streak = 0, run = 0, last = null;
  Object.keys(dayMin).map(Number).sort((a, b) => a - b).forEach(k => { run = (last !== null && Math.round((k - last) / 864e5) === 1) ? run + 1 : 1; last = k; streak = Math.max(streak, run); });
  // Wochen im Zeitraum
  const weeks = []; for (let w = weekStart(from.toISOString()); w <= T; w = weekStart(new Date(w + 8 * 864e5).toISOString())) weeks.push({ ws:w, n:0, min:0, pause:!!(progress.pauseWeeks || {})[w] });
  log.forEach(e => { const w = weeks.find(x => x.ws === weekStart(e.at)); if (w){ w.n++; w.min += e.dur || 0; } });
  const target = weekTarget(), nowWs = weekStart(new Date().toISOString());
  const fullWeeks = weeks.filter(w => w.ws >= F && w.ws + 7 * 864e5 - 1 <= T && w.ws < nowWs);   // nur ganze, abgeschlossene Wochen
  // Säulen (Kategorien) nach Minuten
  const pil = {}; log.forEach(e => { const s = SETS.find(x => x.id === e.mission), ps = s && s.pillars && s.pillars.length ? s.pillars : ['Weitere']; ps.forEach(p => { pil[p] = (pil[p] || 0) + (e.dur || 0) / ps.length; }); });
  // Sets
  const bySet = {}; log.forEach(e => { bySet[e.mission] = (bySet[e.mission] || 0) + 1; });
  // Feedback und Schmerzen
  const fbl = log.filter(e => e.fb && e.fb.strain);
  const pains = painList().filter(r => inR(r.at)).sort(byTime), prevPains = painList().filter(r => inP(r.at)).length;
  const byArea = {}; pains.forEach(r => { const a = byArea[r.area] = byArea[r.area] || { n:0, stark:0 }; a.n++; if (r.level === 'stark') a.stark++; });
  // Rekorde im Zeitraum, verglichen mit dem Bestwert davor
  const better = (m, a, b) => b === null || (METRICS[m].lower ? a < b : a > b);
  const best = (m, L) => L.reduce((b, r) => better(m, r.v, b) ? r.v : b, null);
  const recs = Object.keys(METRICS).map(m => { const L = recList(m), before = L.filter(r => Date.parse(r.at) < F), within = L.filter(r => inR(r.at));
    if (!within.length) return null;
    const b0 = best(m, before), b1 = best(m, within);
    return { m, before:b0, now:b1, pr:b0 !== null && better(m, b1, b0), series:L.filter(r => Date.parse(r.at) <= T).slice(-8) }; }).filter(Boolean);
  const badges = BADGES.filter(b => progress.badges && progress.badges[b.id] && inR(progress.badges[b.id])).map(b => ({ b, at:progress.badges[b.id] })).sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
  const tests = (progress.tests || []).filter(t => inR(t.at));
  // Club-Trainings (On-Ice, Off-Ice, Match/Turnier) ab Beginn des Protokolls bis heute
  const club = { on:{ plan:0, done:0, missed:0, cancelled:0, open:0, xplan:0, xdone:0 }, off:{ plan:0, done:0, missed:0, cancelled:0, open:0, xplan:0, xdone:0 }, game:{ plan:0, done:0, missed:0, cancelled:0, open:0 }, why:{}, day:{} };
  { const since = progress.clubSince ? ymdDate(progress.clubSince).getTime() : Infinity, end = Math.min(T, Date.now());
    for (let d = rpDay0(Math.max(F, Math.min(since, end + 1))); d.getTime() <= end; d = addDays(d, 1)){
      const day = ymd(d), e = clubLog()[day] || {}, ks = new Set(clubItems(planFor(d)).map(i => i[0])); Object.keys(e).forEach(k => ks.add(k));
      const st = [];
      const extra = isExtra(daysStore[day], d);
      ks.forEach(k => { const c = club[k], v = e[k]; if (!c) return; c.plan++;
        if (extra && k !== 'game'){ c.xplan++; if (v && v.s === 'done') c.xdone++; }
        if (!v) { c.open++; st.push('open'); } else { c[v.s]++; st.push(v.s);
          if (v.s === 'missed'){ const w = club.why[k] = club.why[k] || {}; w[v.r || 'ohne'] = (w[v.r || 'ohne'] || 0) + 1; } } });
      if (st.length) club.day[d.getTime()] = st.includes('missed') ? 'missed' : st.includes('open') ? 'open' : st.includes('done') ? 'done' : 'cancelled';
    } }
  return { from, to, F, T, len, log, prev, mins:sum(log), prevMins:sum(prev), days:Object.keys(dayMin).length, dayMin, streak, weeks, fullWeeks, target,
    pil, bySet, fbl, aS:avg(fbl.map(e => e.fb.strain)), aF:avg(fbl.filter(e => e.fb.fun).map(e => e.fb.fun)),
    pains, prevPains, byArea, recs, badges, tests, skips:log.filter(e => e.skips).length, club };
}

const CLUB_WHY_TXT = Object.assign(Object.fromEntries(CLUB_WHY), { ohne:'ohne Grund' });
const clubWhyTxt = w => Object.entries(w || {}).sort((a, b) => b[1] - a[1]).map(([r, n]) => `${n}× ${CLUB_WHY_TXT[r] || r}`).join(', ');
function clubFazit(D){
  const c = D.club, out = [], warn = [], part = (k, l) => { const x = c[k]; if (!x.plan) return '';
    const n = x.plan - x.cancelled, add = [x.xplan ? `davon ${x.xplan} Zusatztraining${x.xplan > 1 ? 's' : ''}` : '', x.missed ? `${x.missed}× ausgelassen` : ''].filter(Boolean);
    return `${l} ${x.done} von ${n}${add.length ? ` (${add.join(', ')})` : ''}`; };
  const t = [part('on', 'On-Ice'), part('off', 'Off-Ice'), part('game', 'Matches/Turniere')].filter(Boolean);
  if (t.length) out.push(`Club-Trainings: ${t.join(', ')}.`);
  if (c.off.missed >= 3) warn.push(`Off-Ice ${c.off.missed}× ausgelassen (${clubWhyTxt(c.why.off)}).`);
  if (c.on.missed >= 2) warn.push(`On-Ice ${c.on.missed}× ausgelassen (${clubWhyTxt(c.why.on)}).`);
  const open = c.on.open + c.off.open + c.game.open;
  if (open) warn.push(`${open} Club-Termin${open > 1 ? 'e sind' : ' ist'} noch nicht bestätigt (Eltern-Bereich).`);
  return { out, warn };
}
function reportFazit(D){
  const out = [], warn = [], perWeek = D.log.length / Math.max(1, D.len / (7 * 864e5)), name = PROFILE.name || 'Dein Kind', cf = clubFazit(D);
  if (!D.log.length) return { out:[`Im gewählten Zeitraum wurden keine APC-Trainings gemacht.`].concat(cf.out), warn:(D.pains.length ? [`${D.pains.length} Schmerzmeldung${D.pains.length > 1 ? 'en' : ''} im Zeitraum.`] : []).concat(cf.warn) };
  out.push(`${name} hat ${D.log.length} APC-Training${D.log.length > 1 ? 's' : ''} absolviert (${D.mins} Minuten, im Schnitt ${perWeek.toFixed(1).replace('.', ',')} pro Woche).`);
  if (D.prev.length){ const d = D.log.length - D.prev.length; out.push(d > 0 ? `Das sind ${d} mehr als im Vergleichszeitraum davor.` : d < 0 ? `Das sind ${-d} weniger als im Vergleichszeitraum davor.` : 'Gleich viele wie im Vergleichszeitraum davor.'); }
  if (D.fullWeeks.length){ const ok = D.fullWeeks.filter(w => w.n >= D.target || w.pause).length; out.push(`Wochenziel (${D.target} Trainings) in ${ok} von ${D.fullWeeks.length} Wochen erreicht.`); }
  const prs = D.recs.filter(r => r.pr); if (prs.length) out.push(`Neue Bestwerte: ${prs.map(r => METRICS[r.m].name).join(', ')}.`);
  if (D.badges.length) out.push(`${D.badges.length} neue${D.badges.length > 1 ? '' : 's'} Abzeichen.`);
  if (D.aF !== null) out.push(`Spass im Schnitt: ${D.aF >= 2.5 ? '«Mega»' : D.aF >= 1.75 ? '«Okay»' : '«Ging so»'}.`);
  if (D.aS !== null && D.aS >= 4) warn.push('Die Trainings wurden im Schnitt als «Streng» oder härter empfunden. Lockere Tage einplanen.');
  Object.entries(D.byArea).forEach(([id, a]) => {
    if (a.stark) warn.push(`${painInfo(id).label}: ${a.n}× gemeldet, davon ${a.stark}× «tut richtig weh». Bitte von einer Fachperson abklären lassen.`);
    else if (a.n >= 2) warn.push(`${painInfo(id).label}: ${a.n}× gemeldet. Weiter beobachten.`); });
  if (progress.painPause) warn.push(`Pausenmodus ist aktiv (${painInfo(progress.painPause.area).label}). Freigabe im Eltern-Bereich.`);
  if (D.skips >= 3) warn.push(`In ${D.skips} Trainings wurden Teile übersprungen.`);
  return { out:out.concat(cf.out), warn:warn.concat(cf.warn) };
}

/* Diagramme als SVG mit festen Druckfarben */
const RP_CLUB = { done:'#1E9E6A', missed:'#E08A00', cancelled:'#C3CAD4', open:'#7C8796' };
const RP_CLUB_ROWS = [['on', 'On-Ice'], ['off', 'Off-Ice'], ['game', 'Matches / Turniere']];
const rpQuote = x => { const n = x.done + x.missed; return n ? Math.round(x.done / n * 100) + ' %' : '–'; };
function rpClubHTML(D){
  const c = D.club, rows = RP_CLUB_ROWS.filter(([k]) => c[k].plan);
  const why = rows.filter(([k]) => c.why[k]).map(([k, l]) => `${l}: ${clubWhyTxt(c.why[k])}`);
  return `<section class="rp-sec"><h2>Club-Trainings</h2>${rows.length ? `<table class="rp-tab rp-grid"><thead><tr><th>Training</th><th class="r">Geplant</th><th class="r">Gemacht</th><th class="r">Ausgelassen</th><th class="r">Ausgefallen</th><th class="r">Offen</th><th class="r">Quote</th></tr></thead><tbody>
      ${rows.map(([k, l]) => { const x = c[k]; return `<tr><td>${l}${x.xplan ? `<br><small class="rp-d">davon ${x.xplan} Zusatz, ${x.xdone} gemacht</small>` : ''}</td><td class="r">${x.plan}</td><td class="r"><b>${x.done}</b></td><td class="r" style="color:${x.missed ? RP_C.warn : 'inherit'}">${x.missed}</td><td class="r">${x.cancelled}</td><td class="r">${x.open}</td><td class="r"><b>${rpQuote(x)}</b></td></tr>`; }).join('')}</tbody></table>
    ${why.length ? `<p class="rp-cap"><b>Gründe für Auslassen</b> · ${why.join(' · ')}</p>` : ''}
    <p class="rp-cap">Quote = gemacht von gemacht + ausgelassen. «Ausgefallen» = vom Club abgesagt, zählt nicht. «Offen» = noch nicht bestätigt.</p>`
    : '<p class="rp-empty">Keine Club-Trainings im Zeitraum erfasst.</p>'}</section>`;
}
function rpCalendar(D){
  if (D.len > 63 * 864e5) return '';
  const C = RP_C, months = []; for (let d = new Date(D.from.getFullYear(), D.from.getMonth(), 1); d <= D.to; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) months.push(d);
  const painDays = new Set(D.pains.map(r => rpDay0(r.at).getTime()));
  const shade = m => m >= 35 ? '#1C5FB0' : m >= 28 ? C.ice : m >= 20 ? '#5E9AE8' : m >= 12 ? '#8DB8EF' : '#BBD5F6';
  return months.map(mo => {
    const y = mo.getFullYear(), m = mo.getMonth(), n = new Date(y, m + 1, 0).getDate(), off = (mo.getDay() + 6) % 7, rows = Math.ceil((off + n) / 7);
    const cw = 96, ch = 40, W = cw * 7, H = 22 + rows * ch;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trainingskalender ${mo.toLocaleDateString('de-CH', { month:'long', year:'numeric' })}">`;
    s += DAYS.map(([, , short], i) => `<text x="${i * cw + cw / 2}" y="14" font-size="12" fill="${C.grey}" text-anchor="middle">${short}</text>`).join('');
    for (let d = 1; d <= n; d++){
      const k = new Date(y, m, d).getTime(), i = off + d - 1, x = (i % 7) * cw, yy = 22 + Math.floor(i / 7) * ch, out = k < rpDay0(D.from).getTime() || k > D.T;
      const min = D.dayMin[k] || 0, fill = out ? '#FAFBFC' : min ? shade(min) : C.soft, tc = min >= 20 && !out ? '#fff' : out ? '#C3CAD4' : C.navy;
      s += `<rect x="${x + 2}" y="${yy + 2}" width="${cw - 4}" height="${ch - 4}" rx="5" fill="${fill}"/>`;
      s += `<text x="${x + 10}" y="${yy + 20}" font-size="13" fill="${tc}">${d}</text>`;
      if (min && !out) s += `<text x="${x + cw - 10}" y="${yy + 20}" font-size="11" fill="${tc}" text-anchor="end">${min}′</text>`;
      if (painDays.has(k) && !out) s += `<circle cx="${x + cw - 14}" cy="${yy + ch - 11}" r="5" fill="${C.red}" stroke="#fff" stroke-width="1.5"/>`;
      if (D.club.day[k] && !out) s += `<rect x="${x + 9}" y="${yy + ch - 13}" width="22" height="6" rx="3" fill="${RP_CLUB[D.club.day[k]]}" stroke="#fff" stroke-width="1"/>`;
    }
    return `<p class="rp-cap rp-mon">${mo.toLocaleDateString('de-CH', { month:'long', year:'numeric' })}</p>${s}</svg>`;
  }).join('') + `<p class="rp-cap"><i class="rp-dot" style="background:${C.ice}"></i>APC-Training (Zahl = Minuten, dunkler = länger) · <i class="rp-dot" style="background:${C.red}"></i>Schmerzmeldung<br>Balken unten = Club-Training: <i class="rp-dot" style="background:${RP_CLUB.done}"></i>gemacht · <i class="rp-dot" style="background:${RP_CLUB.missed}"></i>ausgelassen · <i class="rp-dot" style="background:${RP_CLUB.cancelled}"></i>ausgefallen · <i class="rp-dot" style="background:${RP_CLUB.open}"></i>offen</p>`;
}
function rpWeeks(D){
  if (D.weeks.length < 2) return '';
  const C = RP_C, W = 700, H = 170, pb = 24, pt = 18, max = Math.max(D.target, ...D.weeks.map(w => w.n), 1), cw = W / D.weeks.length, bw = Math.min(40, cw * .6);
  const y = v => H - pb - v / max * (H - pb - pt), many = D.weeks.length > 14;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trainings pro Woche">`;
  s += `<line x1="0" x2="${W}" y1="${y(D.target)}" y2="${y(D.target)}" stroke="${C.warn}" stroke-dasharray="4 4"/><text x="2" y="${y(D.target) - 4}" font-size="11" fill="${C.warn}">Wochenziel ${D.target}</text>`;
  D.weeks.forEach((w, i) => { const x = i * cw + (cw - bw) / 2;
    if (w.n) s += `<rect x="${x}" y="${y(w.n)}" width="${bw}" height="${H - pb - y(w.n)}" rx="4" fill="${w.n >= D.target ? C.ok : C.ice}"/>`;
    s += `<text x="${x + bw / 2}" y="${(w.n ? y(w.n) : H - pb) - 4}" font-size="11" fill="${C.navy}" text-anchor="middle">${w.n}${w.pause ? ' P' : ''}</text>`;
    if (!many || i % 2 === 0) s += `<text x="${x + bw / 2}" y="${H - 6}" font-size="10.5" fill="${C.grey}" text-anchor="middle">${rpDate(w.ws, { day:'numeric', month:'numeric' })}</text>`; });
  return s + `</svg><p class="rp-cap">Balken = Trainings pro Woche (Datum = Montag) · grün = Wochenziel erreicht${D.weeks.some(w => w.pause) ? ' · P = Pausenwoche wegen Schmerzen' : ''}</p>`;
}
function rpFeedback(D){
  const C = RP_C, L = D.fbl.slice(-40); if (!L.length) return '<p class="rp-empty">Keine Feedbacks im Zeitraum.</p>';
  const W = 700, H = 190, pl = 30, pb = 26, pt = 10, cw = (W - pl) / L.length, bw = Math.min(22, cw * .6), y = v => H - pb - v / 5 * (H - pb - pt);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Belastung und Spass">`;
  [1, 2, 3, 4, 5].forEach(v => { s += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#EEF1F4"/><text x="${pl - 6}" y="${y(v) + 4}" font-size="10" fill="${C.grey}" text-anchor="end">${v}</text>`; });
  L.forEach((e, i) => { const x = pl + i * cw + (cw - bw) / 2;
    s += `<rect x="${x}" y="${y(e.fb.strain)}" width="${bw}" height="${H - pb - y(e.fb.strain)}" rx="3" fill="${STRAIN[e.fb.strain - 1][1]}"/>`;
    if (e.fb.pain) s += `<text x="${x + bw / 2}" y="${y(e.fb.strain) - 4}" font-size="13" font-weight="700" fill="${C.red}" text-anchor="middle">!</text>`;
    if (L.length <= 16 || i % Math.ceil(L.length / 12) === 0) s += `<text x="${x + bw / 2}" y="${H - 8}" font-size="10" fill="${C.grey}" text-anchor="middle">${rpDate(e.at, { day:'numeric', month:'numeric' })}</text>`; });
  const pts = L.map((e, i) => e.fb.fun ? [pl + i * cw + cw / 2, y(e.fb.fun * 5 / 3)] : null).filter(Boolean);
  if (pts.length > 1) s += `<polyline points="${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${C.navy}" stroke-width="2"/>`;
  s += pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${C.navy}"/>`).join('');
  return s + `</svg><p class="rp-cap">Balken = Belastung (1 Locker … 5 Hammer) · Linie = Spass (Ging so · Okay · Mega) · <b style="color:${C.red}">!</b> = Schmerz nach dem Training</p>`;
}
function rpSpark(r){
  const L = r.series; if (L.length < 2) return '';
  const W = 90, H = 22, vs = L.map(x => x.v), lo = Math.min(...vs), hi = Math.max(...vs), sp = hi - lo || 1, inv = METRICS[r.m].lower;
  const pts = L.map((x, i) => [i / (L.length - 1) * (W - 4) + 2, inv ? 2 + (x.v - lo) / sp * (H - 4) : H - 2 - (x.v - lo) / sp * (H - 4)]);
  return `<svg viewBox="0 0 ${W} ${H}" class="rp-spark"><polyline points="${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${RP_C.ice}" stroke-width="1.6"/><circle cx="${pts[pts.length - 1][0].toFixed(1)}" cy="${pts[pts.length - 1][1].toFixed(1)}" r="2.5" fill="${RP_C.ice}"/></svg>`;

/* Für den Druck wird nur das Berichtsblatt in einen eigenen Container kopiert (alles andere ist im Druck ausgeblendet). */
function fillPrintRoot(){
  const paper = document.querySelector('#screen-report .rp-paper'); if (!paper) return false;
  let root = $('print-root'); if (!root){ root = document.createElement('div'); root.id = 'print-root'; document.body.appendChild(root); }
  root.innerHTML = paper.outerHTML;
  const ta = root.querySelector('textarea'); if (ta){ const d = document.createElement('div'); d.className = 'rp-note-print'; d.textContent = reportState.note || ''; ta.replaceWith(d); }
  return true;
}
window.addEventListener('beforeprint', () => { if (curScreen === 'report') fillPrintRoot(); });
/* PDF direkt auf dem Gerät erzeugen. Grund: In der Home-Bildschirm-App öffnet iOS kein Druckfenster.
   Baustein pdf-lib (MIT-Lizenz) liegt als pdf-lib.min.js im Repository und wird erst beim ersten Export geladen. */
let pdfLibP = null, rpLastFile = null;
const loadPdfLib = () => pdfLibP || (pdfLibP = new Promise((res, rej) => {
  if (window.PDFLib) return res(window.PDFLib);
  const s = document.createElement('script'); s.src = 'pdf-lib.min.js';
  s.onload = () => window.PDFLib ? res(window.PDFLib) : rej(new Error('PDF-Baustein fehlt.'));
  s.onerror = () => { pdfLibP = null; s.remove(); rej(new Error('PDF-Baustein konnte nicht geladen werden. Einmal mit Internet öffnen, danach geht es auch offline.')); };
  document.head.appendChild(s);
}));

async function buildReportPDF(D){
  const { PDFDocument, StandardFonts, rgb } = await loadPdfLib();
  const doc = await PDFDocument.create();
  const fR = await doc.embedFont(StandardFonts.Helvetica), fB = await doc.embedFont(StandardFonts.HelveticaBold);
  const okSet = new Set(fR.getCharacterSet());
  const MAP = { '′':"'", '▲':'+', '▼':'-', '→':'>', '≥':'>=', '≤':'<=', '’':"'", '‘':"'" };
  const clean = s => Array.from(String(s == null ? '' : s)).map(ch => okSet.has(ch.codePointAt(0)) ? ch : (MAP[ch] || (/\s/.test(ch) ? ' ' : ''))).join('');
  const strip = s => clean(String(s || '').replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"'));
  const col = h => rgb(parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255);
  const C = Object.fromEntries(Object.entries(Object.assign({}, RP_C, { text:'#2B3440', white:'#FFFFFF', brown:'#7A4A00', alertBg:'#FBE9E9', alertTx:'#8A1F1F', grid:'#EEF1F4' })).map(([k, v]) => [k, col(v)]));
  const W = 595.28, H = 841.89, M = 40, CW = W - 2 * M, BOTTOM = H - 46;
  const range = `${rpDate(D.from)} – ${rpDate(D.to)}`, name = PROFILE.name || 'Spieler';
  doc.setTitle(clean(`APC-Bericht ${name} ${range}`)); doc.setAuthor('APC Family Edition'); doc.setCreator('APC – Athlete Performance Centre'); doc.setLanguage('de-CH');
  let page, y = 0;
  const wOf = (s, size, f) => (f || fR).widthOfTextAtSize(clean(s), size);
  function txt(s, x, top, size, o){
    o = o || {}; const f = o.bold ? fB : fR, t = clean(s); if (!t) return;
    let xx = x; const w = f.widthOfTextAtSize(t, size);
    if (o.align === 'right') xx = x - w; else if (o.align === 'center') xx = x - w / 2;
    page.drawText(t, { x:xx, y:H - top - size * 0.78, size, font:f, color:o.color || C.text });
  }
  function wrap(s, size, maxW, bold){
    const f = bold ? fB : fR, out = [];
    clean(s).split('\n').forEach(par => { let line = '';
      par.split(/\s+/).filter(Boolean).forEach(w => { const t = line ? line + ' ' + w : w; if (f.widthOfTextAtSize(t, size) <= maxW || !line) line = t; else { out.push(line); line = w; } });
      out.push(line); });
    return out;
  }

/* ---- Eltern: Sicherung erstellen und wiederherstellen ----

  const musicDB = () => new Promise((res, rej) => { try { const r = indexedDB.open('apc-music', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('tracks', { keyPath:'id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch(e){ rej(e); } });
  const musicTx = (mode, fn) => musicDB().then(db => new Promise((res, rej) => {
    const t = db.transaction('tracks', mode), st = t.objectStore('tracks'); const out = fn(st);
    t.oncomplete = () => { db.close(); res(out && out.result); }; t.onerror = () => { db.close(); rej(t.error); }; }));
  async function create(withMusic){
    const data = {};
    for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith('apc.')) data[k] = localStorage.getItem(k); }
    let music = null;
    if (withMusic){
      music = [];
      const all = await musicTx('readonly', st => st.getAll()).catch(() => []);
      for (const r of (all || [])) music.push({ id:r.id, name:r.name, added:r.added, data:await blobToDataURL(r.blob) });
    }
    return { format:FORMAT, version:VERSION, created:new Date().toISOString(), player:PROFILE.name, data, music };
  }
  async function restore(b){
    if (!b || b.format !== FORMAT || typeof b.data !== 'object') throw new Error('Das ist keine APC-Sicherung.');
    if (b.version > VERSION) throw new Error('Diese Sicherung stammt aus einer neueren App-Version.');
    const old = []; for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith('apc.')) old.push(k); }
    old.forEach(k => localStorage.removeItem(k));
    for (const [k, v] of Object.entries(b.data)) if (k.startsWith('apc.') && typeof v === 'string') localStorage.setItem(k, v);
    if (Array.isArray(b.music)){   // nur ersetzen, wenn die Sicherung Musik enthält
      const tracks = [];
      for (const m of b.music){ try { tracks.push({ id:m.id || (Date.now() + '-' + Math.random().toString(36).slice(2)), name:m.name || 'Track', added:m.added || Date.now(), blob:await dataURLToBlob(m.data) }); } catch(e){} }
      await musicTx('readwrite', st => { st.clear(); tracks.forEach(t => st.put(t)); });
    }
  }
  return { create, restore };
})();

let recState = null;
function clipMsg(t){ const m = $('clip-msg'); if (m) m.textContent = t; }
const clipStatus = {};
/* Aufnahme importieren: dekodieren, auf das gesprochene Wort kürzen (max. 2,5 s, mono) und als kompaktes WAV speichern.
   So funktionieren auch lange oder verlustfreie Sprachmemos, und gespeichert wird nur wenig. */
function wavDataURL(buf, from, to){
  const sr = buf.sampleRate, n = Math.max(1, to - from), ch = buf.numberOfChannels, out = new DataView(new ArrayBuffer(44 + n * 2));
  const w = (o, str) => { for (let i = 0; i < str.length; i++) out.setUint8(o + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); out.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
  out.setUint32(24, sr, true); out.setUint32(28, sr * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, n * 2, true);
  const chans = Array.from({ length:ch }, (_, c) => buf.getChannelData(c));
  let peak = 0; for (let i = from; i < to; i++){ let v = 0; for (let c = 0; c < ch; c++) v += chans[c][i]; v /= ch; peak = Math.max(peak, Math.abs(v)); }
  const gain = peak > 0 ? Math.min(4, 0.9 / peak) : 1;     // leise Aufnahmen anheben
  for (let i = 0; i < n; i++){ let v = 0; for (let c = 0; c < ch; c++) v += chans[c][from + i]; v = Math.max(-1, Math.min(1, v / ch * gain)); out.setInt16(44 + i * 2, v * 32767, true); }
  let bin = ''; const u8 = new Uint8Array(out.buffer); for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return 'data:audio/wav;base64,' + btoa(bin);
}
async function storeClipBlob(id, blob){
  const label = CLIPS.find(c => c.id === id).say, name = blob.name ? `«${blob.name}»` : 'Aufnahme';
  clipMsg(`${label}: ${name} wird geladen …`);
  let buf;
  try { Sound.unlock(); const ab = await (blob.arrayBuffer ? blob.arrayBuffer() : new Response(blob).arrayBuffer()); buf = await Sound.decode(ab); }
  catch(e){ clipStatus[id] = 'Format nicht lesbar'; renderParents();
    clipMsg(`${label}: ${name} (${blob.type || 'unbekannter Typ'}) kann das iPad hier nicht lesen. In Sprachmemos die Aufnahme über «Teilen › In Dateien sichern» als M4A speichern und erneut wählen.`); return; }
  const d0 = buf.getChannelData(0), sr = buf.sampleRate, thr = 0.03;
  let a = 0; while (a < d0.length && Math.abs(d0[a]) < thr) a++;
  let z = d0.length - 1; while (z > a && Math.abs(d0[z]) < thr) z--;
  if (a >= d0.length){ clipStatus[id] = 'zu leise'; renderParents(); clipMsg(`${label}: In der Aufnahme ist nichts zu hören. Bitte lauter und näher am iPad aufnehmen.`); return; }
  const from = Math.max(0, a - Math.round(0.03 * sr)), to = Math.min(d0.length, Math.min(z + Math.round(0.12 * sr), from + Math.round(2.5 * sr)));
  const url = wavDataURL(buf, from, to), prev = clipData[id];
  clipData[id] = url; delete clipBufs[id];
  if (!saveClips()){ if (prev) clipData[id] = prev; else delete clipData[id]; clipStatus[id] = 'Speicher voll'; renderParents(); clipMsg('Speicher voll – bitte eine andere Aufnahme löschen.'); return; }
  delete clipStatus[id];
  const b = await clipBuffer(id); renderParents();
  if (b){ Sound.resume(); Sound.playClip(b); }
  clipMsg(`Gespeichert: ${label} (${((to - from) / sr).toFixed(1)} s).`);
}
async function toggleRecord(id, btn){
  if (recState){ if (recState.rec.state !== 'inactive') recState.rec.stop(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    clipMsg('Aufnehmen ist hier nicht möglich. Nimm das Wort mit der App «Sprachmemos» auf und wähle es über «Datei».'); return; }
  let stream;
  clipMsg('Mikrofon wird angefragt …');
  try { stream = await Promise.race([ navigator.mediaDevices.getUserMedia({ audio:true }), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000)) ]); }
  catch(e){ clipMsg('Kein Zugriff aufs Mikrofon. Nimm das Wort mit der App «Sprachmemos» auf und wähle es über «Datei».'); return; }
  const type = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  const rec = new MediaRecorder(stream, type ? { mimeType:type } : undefined), parts = [];
  recState = { rec, id };
  rec.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
  rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); clearTimeout(recState && recState.timer); recState = null;
    btn.textContent = 'Aufnehmen'; btn.classList.remove('rec-on'); storeClipBlob(id, new Blob(parts, { type: rec.mimeType || type || 'audio/mp4' })); };
  rec.start(); btn.textContent = 'Stopp'; btn.classList.add('rec-on'); clipMsg('Aufnahme läuft … jetzt sprechen.');
  recState.timer = setTimeout(() => { if (rec.state !== 'inactive') rec.stop(); }, 3000);
}
function bindClips(){
  document.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => toggleRecord(b.dataset.rec, b));
  document.querySelectorAll('[data-file]').forEach(inp => inp.onchange = () => { const f = inp.files && inp.files[0]; if (f) storeClipBlob(inp.dataset.file, f); inp.value = ''; });

    Sound.unlock(); Sound.resume(); const buf = await clipBuffer(b.dataset.play);

    if (!settings.voice){ clipMsg('Oben rechts ist «Coach» ausgeschaltet – bitte einschalten.'); return; }

  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { delete clipData[b.dataset.del]; delete clipBufs[b.dataset.del]; saveClips(); renderParents(); clipMsg('Aufnahme gelöscht.'); });

/* Coach-Hinweise je Übung: Anleitung in einzelne Sätze zerlegen und während der Übung nacheinander ansagen */
function coachTips(p){
  const ex = p.ex, calm = p.sec.type === 'cooldown';
  const parts = ((ex.instruction || '').match(/[^.!?]+[.!?]*/g) || []).map(t => t.trim()).filter(t => t.length > 6);
  const general = calm ? 'Ruhig und gleichmässig atmen.' : p.sec.type === 'warmup' ? 'Schön locker bleiben, der Körper wird warm.' : 'Saubere Technik vor Tempo.';
  // Reihenfolge so, dass nichts direkt wiederholt wird, was in der Vorschau oder beim Start schon gesagt wurde
  return [...parts.slice(1), general, parts[0] || ex.coach, ex.coach].filter(Boolean);
}
function nextExercisePhase(from){
  const T = Engine.T;
  for (let j = from + 1; j < T.length; j++) if (T[j].type === 'EXERCISE_RUNNING') return T[j];
  return null;
}
function showVoiceHint(){ const h = $('voice-hint'); if (h) h.hidden = false; }
function showCall(c){
  const el = $('callbox'); if (!el) return;
  el.hidden = false; el.className = 'callbox ' + (c.cls || '');
  el.textContent = c.text; void el.offsetWidth; el.classList.add('pop');
  Voice.speak(c.say || c.text);
}
const fmtWork = s => s >= 60 && s % 60 === 0 ? (s / 60) + ' Min' : s >= 60 ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' Min' : s + ' Sek';
function setCoach(text, speakIt, opts){

}

function updateProgress(p, leftMs){
  const T = Engine.T; if (!T) return;
  const elapsed = p.start + (p.dur - leftMs * settings.speed / 1000);
  const pct = Math.max(0, Math.min(100, elapsed / T.total * 100));
  $('p-bar').style.width = pct + '%';
  $('p-rink').setAttribute('aria-valuenow', Math.round(pct));
}

function onPhaseTick(p, leftMs){
  const missionLeft = leftMs * settings.speed / 1000;
  const secs = Math.ceil(missionLeft - 1e-6);
  const frac = Math.max(0, Math.min(1, leftMs / Engine.realMs(p)));
  updateProgress(p, leftMs);
  { const nx = Engine.T && Engine.T[Engine.i + 1];   // Musik kurz vor dem 3-2-1 schon leiser, damit «Drei» pünktlich kommt
    if (nx && nx.type === 'EXERCISE_COUNTDOWN' && missionLeft <= 0.9) Engine.once('rcNext', () => Voice.readyCount(1500)); }
  switch (p.type){
    case 'MISSION_COUNTDOWN': {
      const d = secs - 1;
      Engine.once('d' + d, () => {
        if (d > 0) setDigit(d);   // «Ready…» kam schon beim Tippen, hier folgt «Go!»
        else if (d === 0){ setDigit('GO', true); coachSay('Go!', 'en'); }
      });
      break;
    }
    case 'EXERCISE_COUNTDOWN':
      if (secs > 0) Engine.once('d' + secs, () => { setDigit(secs); Sound.sfx.tick(); if (secs === 3) coachSay('Ready…', 'en'); else if (secs === 1) coachSay('Go!', 'en'); });   // «Ready…», beim Übungsstart «Go!»
      break;
    case 'EXERCISE_PREVIEW': {
      const b = $('prev-bar'); if (b) b.style.width = ((1 - frac) * 100) + '%';
      break;
    }
    case 'EXERCISE_RUNNING':
    case 'BREAK': {
      const s = $('secs'); if (s && s.textContent !== String(secs)) s.textContent = secs;
      const a = $('arc'); if (a) a.setAttribute('stroke-dashoffset', String(CIRC * (1 - frac)));
      if (p.type === 'EXERCISE_RUNNING'){
        const calm = p.sec.type === 'cooldown', ex = p.ex, el = p.dur - missionLeft;
        // Ticker: 2× pro Sekunde leise ticken; in den letzten 3 Sekunden übernimmt der Countdown «Three, Two, One»
        if (missionLeft > 3.05){ const ck = Math.floor(el * 2); Engine.once('ck' + ck, () => Sound.sfx.clock(ck % 2 === 0)); }
        const scripted = ex.sides || ex.cues || ex.calls;
        if (ex.sides && missionLeft <= p.dur / 2) Engine.once('side', () => { setCoach('Seite wechseln!', false); coachSay('Seite wechseln!', 'de'); });
        if (ex.cues) ex.cues.forEach((c, k) => { if (el >= c.at) Engine.once('cue' + k, () => {
          setCoach(c.text, true);
          if (c.anim){ const cap = $('cap'); Anim.mount($('fig'), c.anim, { caption:cap }); }
        }); });
        if (ex.calls && CALLS[ex.calls] && el >= 2 && missionLeft > 1.5){
          const k = Math.floor((el - 2) / CALLS[ex.calls].every);
          Engine.once('call' + k, () => showCall(CALLS[ex.calls].gen()));
        }
        // regelmässige Technik-Hinweise: alle 8–15 Sek. ein neuer Satz aus der Anleitung, dazwischen Motivation
        if (!ex.calls && p.dur > 15){
          const every = p.dur >= 60 ? 15 : p.dur >= 30 ? 10 : 8;
          const k = Math.floor(el / every);
          if (k >= 1 && missionLeft > (p.dur >= 25 ? 13 : 10) && !(ex.sides && Math.abs(missionLeft - p.dur / 2) < 3)) Engine.once('tip' + k, () => {
            const tips = coachTips(p);
            const txt = k % 3 === 0 ? pick(calm ? COACH.halfCalm : COACH.half) : tips[(k - 1 - Math.floor(k / 3)) % tips.length];
            setCoach(txt, true);
          });
        }
        if (!ex.calls && p.dur >= 25 && secs <= 10) Engine.once('ten', () => setCoach(calm ? 'Noch zehn Sekunden. Ruhig atmen.' : COACH.ten, true, { urgent:true }));
      }
      if (p.type === 'EXERCISE_RUNNING' && p.dur >= 8){
        if (secs === 4) Engine.once('rc', () => Voice.readyCount(1800));
        if (secs <= 3 && secs > 0) Engine.once('v' + secs, () => coachSay(EN_WORDS[secs], 'en'));   // letzte 3 Sekunden auf Englisch
      }
      if (secs <= 3 && secs > 0) Engine.once('t' + secs, () => Sound.sfx.tock());
      break;
    }
    case 'MISSION_COMPLETE': {
      const c = $('xp-count');
      if (c) c.textContent = Math.round(MISSION.completionXP * Math.min(1, (1 - frac) * 2.2));
      break;
    }
  }
}

/* ---- Belohnungen: Protokoll, Profikarten, Abzeichen ---- */
function weekStart(iso){ const d = new Date(iso); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getTime(); }
function stats(prog){
  const log = prog.log || [];
  const weeks = {};
  log.forEach(e => { const k = weekStart(e.at); weeks[k] = (weeks[k] || 0) + 1; });
  const keys = Object.keys(weeks).map(Number).sort((x, y) => x - y);
  let best = 0, run = 0, prev = null;
  keys.forEach(k => {
    if (weeks[k] >= 2){ run = (prev !== null && Math.round((k - prev) / 864e5) === 7) ? run + 1 : 1; prev = k; best = Math.max(best, run); }
    else { run = 0; prev = null; }
  });
  const hours = log.map(e => new Date(e.at));
  return {
    missions: log.length,
    noSkip:   log.filter(e => !e.skips).length,
    mainZero: log.filter(e => e.mission === 'mission-zero' && e.mainDone).length,
    mainOne:  log.filter(e => e.mission === 'mission-one' && e.mainDone).length,
    variety:  new Set(log.filter(e => /^set-/.test(e.mission)).map(e => e.mission)).size,
    block1:   new Set(log.filter(e => BLOCK1.indexOf(e.mission) >= 0).map(e => e.mission)).size,
    records:  prog.prCount || 0,
    tests:    (prog.tests || []).length,
    elite:    log.filter(e => e.elite).length,
    champion: prog.titles || 0,
    weekCount: keys.reduce((m, k) => Math.max(m, weeks[k]), 0),
    weekStreak: best,
    early:   hours.some(d => d.getHours() < 9) ? 1 : 0,
    late:    hours.some(d => d.getHours() >= 18) ? 1 : 0,
    weekend: hours.some(d => d.getDay() === 0 || d.getDay() === 6) ? 1 : 0,
    cards:   (prog.cards || []).length
  };
}
function badgeProgress(b, st){ const n = b.rule.n; return { cur: Math.min(st[b.rule.type] || 0, n), n }; }
function grant(prog, entry){
  if (!prog.season) prog.season = { n:1, start:entry.at };
  const before = seasonState(prog);
  prog.log = (prog.log || []).concat(entry).slice(-500);
  const after = seasonState(prog);
  let seasonMsg = null;
  if (after.champion && !before.champion){ prog.titles = (prog.titles || 0) + 1; prog.xp += 200; seasonMsg = `Meister der Saison ${after.n}! +200 XP`; }
  else if (after.rounds.filter(r => r.won).length > before.rounds.filter(r => r.won).length){ const r = after.rounds.filter(x => x.won).pop(); seasonMsg = `${r.name} gewonnen!`; }
  else if (after.games.length > before.games.length){ seasonMsg = `Spieltag ${after.games.length}: +${after.games[after.games.length - 1].pts} Punkte`; if (after.regularDone && !before.regularDone) seasonMsg += ' · Playoffs erreicht!'; }
  prog.badges = prog.badges || {}; prog.cards = prog.cards || [];
  prog.xp += MISSION.completionXP; prog.completed += 1; prog.last = entry.at;
  let card = null;
  const ci = PROS.findIndex((_, i) => prog.cards.indexOf(i) < 0);
  if (ci >= 0){ prog.cards.push(ci); card = PROS[ci]; }
  const st = stats(prog), fresh = [];
  BADGES.forEach(b => {
    if (prog.badges[b.id]) return;
    const pr = badgeProgress(b, st);
    if (pr.cur >= pr.n){ prog.badges[b.id] = entry.at; prog.xp += TIER[b.tier].xp; fresh.push(b); }
  });
  return { card, badges:fresh, bonus: fresh.reduce((x, b) => x + TIER[b.tier].xp, 0), seasonMsg };
}
function completeRun(){
  if (Engine.awardedRun === Engine.runId) return Engine.lastReward;   // nur einmal pro Durchgang
  Engine.awardedRun = Engine.runId;
  const test = settings.speed > 1;                                     // Testläufe zählen nicht
  const entry = { at:new Date().toISOString(), mission:MISSION.id, skips:Engine.skips, mainDone:!Engine.skipSecs.has('main'), elite:!!MISSION.elite, dur:Math.max(1, Math.round((Date.now() - (Engine.startedAt || Date.now())) / 60000)) };
  const target = test ? JSON.parse(JSON.stringify(progress)) : progress;
  const r = grant(target, entry);
  // Tages-Quest (ohne Überspringen) und Wochenziel: einmalige Bonus-XP
  const extra = [], dk = new Date(entry.at).toDateString(), wk = weekStart(entry.at);
  target.quests = target.quests || {}; target.weekBonus = target.weekBonus || {};
  if (!entry.skips && !target.quests[dk]){ target.quests[dk] = 1; target.xp += 25; extra.push('Tages-Quest geschafft: +25 XP'); }
  if (!target.weekBonus[wk] && (target.log || []).filter(e => weekStart(e.at) === wk).length >= weekTarget()){ target.weekBonus[wk] = 1; target.xp += 50; extra.push('Wochenziel erreicht: +50 XP'); }
  Object.keys(target.quests).sort((x, y) => Date.parse(y) - Date.parse(x)).slice(30).forEach(k => delete target.quests[k]);
  r.extra = extra;
  r.test = test;
  if (!test) saveProgress();
  Engine.lastReward = r;
  return r;
}

const PILLAR_ATTR = { 'Schnelligkeit':'SPD', 'Kraft':'PWR', 'Stabilität':'BAL', 'Koordination':'BAL', 'Ausdauer':'END', 'Reaktion':'FOC', 'Konzentration':'FOC', 'Mentale Stärke':'FOC', 'Beweglichkeit':'MOB', 'Regeneration':'MOB' };
const SEASON = { regular:12, playoffs:[ { name:'Viertelfinal', set:'set-01' }, { name:'Halbfinal', set:'set-13' }, { name:'Final', set:'set-21' } ] };

/* ---------- Rekorde ---------- */
const recList = m => ((progress.records || {})[m] || []);
function bestOf(m){ const L = recList(m); if (!L.length) return null; return L.reduce((b, r) => (METRICS[m].lower ? r.v < b : r.v > b) ? r.v : b, L[0].v); }
const fmtVal = (m, v) => v === null || v === undefined ? '–' : (METRICS[m].step < 1 ? v.toFixed(2) : String(Math.round(v))) + ' ' + METRICS[m].unit;
function addRecord(m, v, src){
  progress.records = progress.records || {};
  const prev = bestOf(m), isPR = prev === null || (METRICS[m].lower ? v < prev : v > prev);
  (progress.records[m] = progress.records[m] || []).push({ v, at:new Date().toISOString(), src });
  let xp = 0;
  if (isPR){ xp = prev === null ? 10 : 20; progress.xp += xp; if (prev !== null) progress.prCount = (progress.prCount || 0) + 1; }
  const fresh = checkBadges(progress);
  saveProgress();
  return { isPR, prev, xp, fresh };
}
function checkBadges(prog){
  const st = stats(prog), fresh = [];
  BADGES.forEach(b => { if (prog.badges[b.id]) return; const pr = badgeProgress(b, st);
    if (pr.cur >= pr.n){ prog.badges[b.id] = new Date().toISOString(); prog.xp += TIER[b.tier].xp; fresh.push(b); } });
  return fresh;
}
function sparkSVG(m){
  const L = recList(m); if (L.length < 2) return '';
  const vs = L.map(r => r.v), mn = Math.min(...vs), mx = Math.max(...vs), W = 160, H = 40, pad = 4;
  const y = v => mx === mn ? H / 2 : (METRICS[m].lower ? pad + (v - mn) / (mx - mn) * (H - 2 * pad) : H - pad - (v - mn) / (mx - mn) * (H - 2 * pad));
  const pts = vs.map((v, i) => `${(pad + i / (vs.length - 1) * (W - 2 * pad)).toFixed(1)},${y(v).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.join(' ')}"/><circle cx="${pts[pts.length - 1].split(',')[0]}" cy="${pts[pts.length - 1].split(',')[1]}" r="3.5"/></svg>`;
}
function recordToast(m, res){
  const t = $('toast'); if (!t) return;
  t.innerHTML = res.isPR ? `<b>${res.prev === null ? 'Erster Wert' : 'Neuer Rekord!'}</b> ${METRICS[m].name}: ${fmtVal(m, bestOf(m))}${res.xp ? ` · +${res.xp} XP` : ''}${res.fresh.length ? ` · Abzeichen: ${res.fresh.map(b => b.name).join(', ')}` : ''}`
                       : `Eingetragen: ${METRICS[m].name}. Bestwert bleibt ${fmtVal(m, bestOf(m))}.`;
  t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, 4500);
  if (res.isPR && res.prev !== null){ Sound.unlock(); Sound.sfx.success(); }   // keine Ansage: Musik soll in den Menüs durchlaufen
}
function recordInputHTML(m, idp){
  return `<div class="rec-in"><input id="${idp}-${m}" type="number" inputmode="decimal" step="${METRICS[m].step}" min="0" placeholder="${METRICS[m].unit === 's' ? 'Sek.' : METRICS[m].unit === 'cm' ? 'cm' : 'Anzahl'}" aria-label="${METRICS[m].name} eintragen">
    <button class="btn btn-ghost btn-small" data-rec="${m}" data-idp="${idp}">Eintragen</button></div>`;
}
function bindRecordInputs(root, after){
  root.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => {
    const m = b.dataset.rec, inp = $(b.dataset.idp + '-' + m), v = parseFloat(String(inp.value).replace(',', '.'));
    if (!(v > 0)){ inp.focus(); return; }
    const res = addRecord(m, v, MISSION ? MISSION.id : 'manuell'); inp.value = ''; recordToast(m, res); if (after) after();
  });
}
function openRecords(){
  Voice.stop();
  const rows = Object.keys(METRICS).map(m => {
    const L = recList(m), b = bestOf(m);
    return `<article class="rec-row">
      <div class="rec-txt"><b>${METRICS[m].name}</b><small>${METRICS[m].how}</small></div>
      <div class="rec-best"><small>Bestwert</small><b>${fmtVal(m, b)}</b>${L.length ? `<small>${L.length} Eintr. · zuletzt ${fmtDate(L[L.length - 1].at)}</small>` : '<small>noch kein Eintrag</small>'}</div>
      <div class="rec-graph">${sparkSVG(m)}</div>
      ${recordInputHTML(m, 'rr')}
    </article>`; }).join('');
  $('screen-records').innerHTML = `
  <div class="inner trophies">
    <div class="tr-head">
      <div><p class="eyebrow">Fortschritt</p><h1>Rekorde &amp; Testtag</h1></div>
      <button class="btn btn-ghost btn-small" data-back><span class="arrow back" aria-hidden="true"></span> Mission Center</button>
    </div>
    ${testBannerHTML(true)}
    <h3 class="ms-h">Persönliche Rekorde</h3>
    <p class="muted">Trage Ergebnisse aus den Tages-Challenges ein. Jeder neue Bestwert bringt XP und verbessert deine Spielerkarte.</p>
    <div class="rec-list">${rows}</div>
    ${testHistoryHTML()}
    <button class="btn btn-primary" data-back><span class="arrow back" aria-hidden="true"></span> Zurück zum Mission Center</button>
  </div>`;
  bindRecordInputs($('screen-records'), openRecords);
  bindBack($('screen-records'));
  const tb = $('btn-testday2'); if (tb) tb.onclick = openTestday;
  show('records');
}
function bindBack(root){ root.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { stopWatch(); renderCenter(); show('center'); }); }

/* ---------- Testtag ---------- */
const lastTest = () => { const T = progress.tests || []; return T.length ? T[T.length - 1] : null; };
const testDays = () => settings.testWeeks * 7;
function testDue(){ const t = lastTest(); if (!t) return { due:true, first:true }; const days = (Date.now() - Date.parse(t.at)) / 864e5; return { due:days >= testDays(), days:Math.floor(days) }; }
function testBannerHTML(inRecords){
  const d = testDue(), t = lastTest();
  if (!inRecords) return d.due ? `<button class="mc2-testdue" id="btn-testday">Test fällig <span class="arrow" aria-hidden="true"></span></button>` : '';
  return `<article class="test-banner${d.due ? ' due' : ''}">
    <div><p class="eyebrow">${d.due ? (d.first ? 'Startwerte festhalten' : 'Testtag fällig') : 'Testtag'}</p>
      <b>${d.first ? 'Erster Testtag' : d.due ? 'Zeit für den nächsten Testtag' : 'Nächster Testtag in ' + Math.max(1, testDays() - d.days) + ' Tagen'}</b>
      <p class="muted">${d.first ? `6 kurze Tests als Startpunkt. Alle ${settings.testWeeks} Wochen wiederholen und sehen, wie du besser wirst.` : t ? 'Letzter Test am ' + fmtDate(t.at) + '. Vergleiche deine Werte mit damals.' : ''}</p></div>
    <button class="btn ${d.due ? 'btn-primary' : 'btn-ghost'} btn-small" id="${inRecords ? 'btn-testday2' : 'btn-testday'}">Testtag starten <span class="arrow" aria-hidden="true"></span></button>
  </article>`;
}
function testHistoryHTML(){
  const T = progress.tests || []; if (!T.length) return '';
  const a = T.length > 1 ? T[T.length - 2] : null, b = T[T.length - 1];
  return `<h3 class="ms-h">Testtag-Vergleich</h3>
  <div class="test-cmp"><div class="tc-head"><span></span><span>${a ? fmtDate(a.at) : '–'}</span><span>${fmtDate(b.at)}</span><span></span></div>
  ${TEST_METRICS.map(m => { const va = a ? a.values[m] : undefined, vb = b.values[m];
    const better = va !== undefined && vb !== undefined && (METRICS[m].lower ? vb < va : vb > va), worse = va !== undefined && vb !== undefined && (METRICS[m].lower ? vb > va : vb < va);
    return `<div class="tc-row"><span>${METRICS[m].name}</span><span>${va !== undefined ? fmtVal(m, va) : '–'}</span><span>${vb !== undefined ? fmtVal(m, vb) : '–'}</span><span class="${better ? 'up' : worse ? 'down' : ''}">${better ? '▲ besser' : worse ? '▼' : ''}</span></div>`; }).join('')}
  </div>`;
}
let watch = null;
function stopWatch(){ if (watch){ cancelAnimationFrame(watch.raf); watch = null; } }
function openTestday(){
  Voice.stop(); stopWatch();
  const prev = lastTest();
  $('screen-test').innerHTML = `
  <div class="inner trophies">
    <div class="tr-head">
      <div><p class="eyebrow">Vorher-nachher</p><h1>Testtag</h1></div>
      <button class="btn btn-ghost btn-small" data-back><span class="arrow back" aria-hidden="true"></span> Mission Center</button>
    </div>
    <p class="muted">Vorher kurz aufwärmen (5 Min. locker laufen, ein paar Sprünge). Jeder Test mit voller Konzentration, dazwischen genug Pause. Es zählen nur saubere Versuche. Tests mit Zeit kannst du mit der eingebauten Stoppuhr messen.</p>
    <div class="test-list">${TEST_METRICS.map((m, i) => `
      <article class="test-row">
        <div class="rec-txt"><b>${i + 1}. ${METRICS[m].name}</b><small>${METRICS[m].how}</small>
          <small class="muted">Bestwert: ${fmtVal(m, bestOf(m))}${prev && prev.values[m] !== undefined ? ' · Letzter Test: ' + fmtVal(m, prev.values[m]) : ''}</small></div>
        <div class="test-in">
          <input id="tt-${m}" type="number" inputmode="decimal" step="${METRICS[m].step}" min="0" placeholder="${METRICS[m].unit}" aria-label="${METRICS[m].name}">
          ${METRICS[m].unit === 's' ? `<button class="btn btn-ghost btn-small sw" data-sw="${m}">Stoppuhr</button>` : ''}
        </div>
      </article>`).join('')}</div>
    <div class="actions"><button class="btn btn-primary" id="btn-test-save">Testtag speichern</button><button class="btn btn-ghost" data-back>Abbrechen</button></div>
  </div>`;
  bindBack($('screen-test'));
  document.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => {
    const m = b.dataset.sw, inp = $('tt-' + m);
    if (watch && watch.m === m){ const s = (performance.now() - watch.t0) / 1000; inp.value = METRICS[m].step < 1 ? s.toFixed(2) : Math.round(s); stopWatch(); b.textContent = 'Stoppuhr'; Sound.unlock(); Sound.sfx.tock(); return; }
    stopWatch(); document.querySelectorAll('[data-sw]').forEach(x => { x.textContent = 'Stoppuhr'; });
    Sound.unlock(); Sound.sfx.whistle();
    watch = { m, t0:performance.now() }; b.textContent = 'Stopp';
    const tick = () => { if (!watch || watch.m !== m) return; const s = (performance.now() - watch.t0) / 1000; inp.value = METRICS[m].step < 1 ? s.toFixed(2) : Math.floor(s); watch.raf = requestAnimationFrame(tick); };
    tick();
  });
  $('btn-test-save').onclick = () => {
    stopWatch();
    const values = {}; let n = 0, prs = 0;
    TEST_METRICS.forEach(m => { const v = parseFloat(String($('tt-' + m).value).replace(',', '.')); if (v > 0){ values[m] = v; n++; } });
    if (!n){ $('tt-' + TEST_METRICS[0]).focus(); return; }
    Object.keys(values).forEach(m => { if (addRecord(m, values[m], 'test').isPR) prs++; });
    progress.tests = (progress.tests || []).concat({ at:new Date().toISOString(), values });
    progress.xp += 30; checkBadges(progress); saveProgress();
    Voice.speak(`Testtag gespeichert. ${prs ? prs + ' neue Bestwerte!' : 'Stark gemacht!'}`);
    openRecords();
    const t = $('toast'); if (t){ t.innerHTML = `<b>Testtag gespeichert</b> · +30 XP${prs ? ` · ${prs} Bestwert${prs > 1 ? 'e' : ''}` : ''}`; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, 4500); }
  };
  show('test');
}

/* ---------- Spielerkarte ---------- */
function attributes(){
  const A = {}; ATTRS.forEach(([k]) => { A[k] = 50; });
  const cnt = {}; ATTRS.forEach(([k]) => { cnt[k] = 0; });
  (progress.log || []).forEach(e => { const m = SETS.find(x => x.id === e.mission); if (!m) return;
    const hit = new Set(m.pillars.map(pl => PILLAR_ATTR[pl]).filter(Boolean));
    hit.forEach(k => { A[k] += 3.2 / (1 + cnt[k] / 12) * (e.elite ? 1.3 : 1); cnt[k]++; }); });
  Object.keys(METRICS).forEach(m => { const L = recList(m); if (L.length < 2) return; let best = L[0].v, imp = 0;
    L.slice(1).forEach(r => { if (METRICS[m].lower ? r.v < best : r.v > best){ imp++; best = r.v; } }); A[METRICS[m].attr] += Math.min(10, imp * 2); });
  Object.keys(A).forEach(k => { A[k] = Math.min(99, Math.round(A[k])); });
  A.OVR = Math.round(ATTRS.reduce((s, [k]) => s + A[k], 0) / ATTRS.length);
  return A;
}
function playerBtnHTML(){
  const A = attributes();
  return `<button class="trophy-btn" id="btn-card" aria-label="Spielerkarte öffnen"><span class="ovr-mini">${A.OVR}</span><span><small>Spielerkarte</small><b>#${player.no}</b></span></button>`;
}

const avatar = Object.assign({}, AV_DEF, store.get('apc.avatar.v1', {}));

function avShade(hex, f){   // f>0 aufhellen, f<0 abdunkeln
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255]
    .map(v => Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f)));
  return '#' + c.map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('');
}
const avLum = hex => { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; };
let avUid = 0;

function avatarSVG(a, no){
  /* Realistische Proportionen: Kopf mit Helm ca. 1/7 der Höhe, breite Schulterpolster, lange Beine, Hockey-Grundstellung */
  const u = 'av' + (++avUid), S = avShade;
  const J = a.jersey, A = a.accent === a.jersey ? (avLum(J) > .6 ? '#16181D' : '#F1F3F6') : a.accent;
  const numFill = avLum(J) > .6 ? A : '#F1F3F6', numLine = avLum(J) > .6 ? '#F1F3F6' : A;
  const P = a.pants, G = a.gloves, H = a.helmet, K = a.skate, ST = a.stick, SK = a.skin, HR = a.hair;
  const cheer = (a.pose || 'ready') !== 'ready', mirror = a.shoots === 'R';
  const g = (id, c, f1, f2) => `<linearGradient id="${u}${id}" x1="0" y1="0" x2="1" y2="0.2"><stop offset="0" stop-color="${S(c, f1)}"/><stop offset=".42" stop-color="${c}"/><stop offset="1" stop-color="${S(c, f2)}"/></linearGradient>`;
  const F = id => `url(#${u}${id})`;
  const nrm = (p, q) => { const dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; };
  const pt = (p, n, w) => `${(p[0] + n[0] * w).toFixed(1)} ${(p[1] + n[1] * w).toFixed(1)}`;
  const lerp = (p, q, t) => [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];
  /* Fläche entlang einer Linie mit Breiten (für Beine und Ärmel) */
  const limb = (pts, ws) => {
    const L = [], R = [];
    pts.forEach((p, i) => { const q = pts[Math.min(i + 1, pts.length - 1)], o = pts[Math.max(i - 1, 0)], n = nrm(o, q); L.push(pt(p, n, ws[i])); R.unshift(pt(p, n, -ws[i])); });
    return `M${L[0]} ` + L.slice(1).map(v => `L${v}`).join(' ') + ' ' + R.map(v => `L${v}`).join(' ') + ' Z';
  };
  const band = (p, q, t1, t2, w1, w2, col) => { const a1 = lerp(p, q, t1), b1 = lerp(p, q, t2), n = nrm(p, q);
    return `<path d="M${pt(a1, n, w1)} L${pt(b1, n, w2)} L${pt(b1, n, -w2)} L${pt(a1, n, -w1)} Z" fill="${col}"/>`; };
  /* ---------- Beine (Stutzen über Schienbeinschoner) ---------- */

    <path d="${limb([hip, knee, ank], [16, 15, 12])}" fill="${F('jer')}"/>
    <path d="${limb([hip, knee, ank], [16, 15, 12])}" fill="url(#${u}foldv)"/>
    ${band(knee, ank, .2, .32, 14.4, 13.8, A)}${band(knee, ank, .42, .5, 13.6, 13.2, A)}
    <ellipse cx="${knee[0]}" cy="${knee[1] - 2}" rx="13" ry="9" fill="#FFFFFF" opacity=".08"/>
    <path d="M${pt(knee, nrm(hip, ank), -14)} Q${knee[0]} ${knee[1] + 6} ${pt(knee, nrm(hip, ank), 14)}" stroke="${S(J, -.45)}" stroke-width="1.6" fill="none" opacity=".5"/>`;
  const skate = (x, side) => {   // Schlittschuh leicht nach aussen gedreht (3/4-Ansicht)
    const d = side, tx = x + d * 22, light = avLum(K) > .5;
    return `
    <path d="M${x - 12} 390 L${x + 12} 390 L${x + 13} 404 Q${x + d * 6} 410 ${tx} 412 Q${tx + d * 5} 414 ${tx + d * 3} 419 L${x - d * 15} 419 Q${x - d * 16} 410 ${x - d * 13} 402 Z" fill="${F('sk')}"/>
    <path d="M${x - 8} 388 L${x + 8} 388 L${x + 7} 398 L${x - 7} 398 Z" fill="${S(K, light ? -.12 : .22)}"/>
    <path d="M${x - 6} 401 L${x + 6} 401 M${x - 6} 405 L${x + 6} 405" stroke="${light ? '#9AA4B2' : '#6A7180'}" stroke-width="1.1"/>
    <path d="M${x + d * 4} 410 Q${tx} 410.5 ${tx + d * 3} 416" stroke="${S(K, light ? -.3 : .3)}" stroke-width="1.4" fill="none" opacity=".7"/>
    <path d="M${x - d * 14} 419 L${tx + d * 2} 419 L${tx - d * 1} 424 L${x - d * 12} 424 Z" fill="#E6EAF0"/>
    <path d="M${x - d * 16} 426.4 L${tx + d * 5} 426.4" stroke="url(#${u}steel)" stroke-width="2.4" stroke-linecap="round"/>`;
  };
  /* ---------- Ärmel, Handschuhe, Stock ---------- */
  const sleeve = (s, e, h) => {
    const ws = [21, 16.5, 13.5], d = limb([s, e, h], ws), n2 = nrm(e, h);
    return `<path d="${d}" fill="${F('jer')}"/><path d="${d}" fill="url(#${u}foldv)" opacity=".7"/>
      ${band(e, h, .46, .56, 15.5, 15, A)}${band(e, h, .64, .74, 14.8, 14.3, A)}
      <path d="M${pt(s, nrm(s, e), 21)} Q${s[0]} ${s[1] - 26} ${pt(s, nrm(s, e), -21)}" fill="${S(J, .04)}"/>
      <path d="M${pt(lerp(s, e, .12), nrm(s, e), 20)} L${pt(lerp(s, e, .12), nrm(s, e), -20)}" stroke="${S(J, -.4)}" stroke-width="1.4" opacity=".35"/>
      <path d="M${pt(h, n2, 13.5)} L${pt(h, n2, -13.5)}" stroke="${S(J, -.45)}" stroke-width="3" opacity=".55"/>`;

const CARD_COLORS = [['gold','Gold'],['silver','Silber'],['bronze','Bronze'],['ice','Eis'],['red','Rot'],['green','Grün'],['violet','Violett'],['black','Elite Schwarz']];

/* ---- Spielerkarte: eigene Bilder (nur auf diesem Gerät, in localStorage – damit auch in der Sicherung) ---- */
const CardImgs = (() => {
  const K = 'apc.cardimgs.v1', KS = 'apc.cardimg.v1', MAX = 8;
  const list = () => store.get(K, []);
  const sel = () => { const id = store.get(KS, ''); return list().some(i => i.id === id) ? id : ''; };
  const current = () => { const id = sel(); return id ? list().find(i => i.id === id) : null; };
  const select = id => store.set(KS, id || '');
  function shrink(file){   // Foto auf max. 720 px verkleinern und als JPEG speichern, damit der Speicher reicht
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => { const k = Math.min(1, 720 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82)); };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bild kann nicht gelesen werden.')); };
      img.src = url;
    });
  }
  async function add(files){
    const L = list(); let last = '';
    for (const f of files){
      if (L.length >= MAX) throw new Error(`Höchstens ${MAX} Bilder.`);
      const data = await shrink(f), id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      L.push({ id, data }); last = id;
      try { localStorage.setItem(K, JSON.stringify(L)); } catch(e){ L.pop(); throw new Error('Speicher voll – bitte ein Bild entfernen.'); }
    }
    if (last) select(last);
  }
  function remove(id){ store.set(K, list().filter(i => i.id !== id)); if (store.get(KS, '') === id) select(''); }
  return { list, sel, current, select, add, remove, MAX };
})();
/* Datei-Feld steckt sichtbar im Knopf (label + input) – so öffnet iPadOS/iOS die Fotoauswahl zuverlässig */
function bindCardImgInput(inp, onDone, msgEl){
  if (!inp) return;
  inp.onchange = async () => {
    const files = [...(inp.files || [])]; if (!files.length) return;
    if (msgEl) msgEl.textContent = 'Bild wird gespeichert …';
    try { await CardImgs.add(files); onDone(); }
    catch(e){ if (msgEl) msgEl.textContent = e.message; else alert(e.message); }
    inp.value = '';
  };
}

/* ---------- Saison ---------- */
function seasonState(prog){
  const s = prog.season || { n:1, start:null };
  const log = (prog.log || []).filter(e => !s.start || Date.parse(e.at) >= Date.parse(s.start));
  const games = log.slice(0, SEASON.regular).map(e => ({ e, pts: e.skips ? 2 : 3, m:SETS.find(x => x.id === e.mission) }));
  const pts = games.reduce((a, g) => a + g.pts, 0);
  const st = { n:s.n, games, pts, regularDone: games.length >= SEASON.regular, rounds:[], champion:false, next:null };
  if (st.regularDone){
    let from = Date.parse(games[games.length - 1].e.at);
    SEASON.playoffs.forEach((r, i) => {
      const prevWon = i === 0 || st.rounds[i - 1].won;
      const win = prevWon ? log.find(e => e.mission === r.set && Date.parse(e.at) > from) : null;
      st.rounds.push({ ...r, won:!!win, at:win ? win.at : null, open:prevWon && !win });
      if (win) from = Date.parse(win.at);
    });
    st.champion = st.rounds.every(r => r.won);
    const open = st.rounds.find(r => r.open); st.next = open ? SETS.find(x => x.id === open.set) : null;
  }
  return st;
}
function seasonCardHTML(){
  const st = seasonState(progress);
  const label = st.champion ? 'Meister!' : st.regularDone ? (st.rounds.find(r => r.open) || {}).name : `Spieltag ${Math.min(st.games.length + 1, SEASON.regular)} von ${SEASON.regular}`;
  const pct = st.champion ? 100 : Math.round((st.games.length + st.rounds.filter(r => r.won).length) / (SEASON.regular + SEASON.playoffs.length) * 100);
  return `<button class="season-card${st.regularDone && !st.champion ? ' po' : ''}${st.champion ? ' champ' : ''}" id="btn-season">
    <span class="sc-l"><small>Saison ${st.n} · Block 1</small><b>${label}</b><small>${st.pts} Punkte${st.regularDone && st.next && !st.champion ? ' · Playoff-Spiel: Set ' + st.next.n + ' ' + st.next.title : ''}</small></span>
    <span class="sc-bar"><i style="width:${pct}%"></i></span><span class="arrow" aria-hidden="true"></span></button>`;
}
function openSeason(){

  $('screen-season').innerHTML = `

    ${st.champion ? `<article class="champ-banner"><b>Meister der Saison ${st.n}!</b><p>Alle Playoff-Runden gewonnen. +200 XP und das Meister-Abzeichen.</p><button class="btn btn-primary btn-small" id="btn-new-season">Neue Saison starten</button></article>` : ''}
    <div class="season-grid">
      <section class="plan sec-main"><p class="no">Hauptrunde · ${st.pts} Punkte</p><b>${st.games.length} / ${SEASON.regular} Spieltage</b><ol class="games">${slots}</ol></section>

        <ol class="games po">${SEASON.playoffs.map((r, i) => { const R = st.rounds[i], m = SETS.find(x => x.id === r.set);
          return `<li class="${R && R.won ? 'done' : R && R.open ? 'next' : ''}"><span class="gd">${['VF','HF','F'][i]}</span><span>${r.name}: Set ${m.n} · ${m.title}</span><b>${R && R.won ? '✓' : ''}</b>${R && R.open ? `<button class="btn btn-primary btn-small" data-open="${m.id}">Spielen</button>` : ''}</li>`; }).join('')}</ol></section>
    </div>
    <button class="btn btn-primary" data-back><span class="arrow back" aria-hidden="true"></span> Zurück zum Mission Center</button>
  </div>`;
  bindBack($('screen-season'));
  bindMissionButtons($('screen-season'));
  const ns = $('btn-new-season'); if (ns) ns.onclick = () => { progress.season = { n:st.n + 1, start:new Date().toISOString() }; saveProgress(); openSeason(); };
  show('season');

const BLOCK1 = SETS.filter(m => m.n >= 1 && m.n <= 19 && m.playable).map(m => m.id);
function doneSets(){ return new Set((progress.log || []).map(e => e.mission)); }
function lockInfo(m){
  if (m.n === 20){ const d = doneSets(), left = BLOCK1.filter(id => !d.has(id)).length; return left ? { locked:true, text:`Gesperrt · noch ${left} Set${left > 1 ? 's' : ''} von Block 1` } : { locked:false }; }
  return { locked:false };
}
const isLocked = m => lockInfo(m).locked;
const timesDone = m => (progress.log || []).filter(e => e.mission === m.id).length;
const eliteReady = m => timesDone(m) >= 3;
function eliteVersion(m){
  const c = Object.assign({}, m, { elite:true, title:m.title + ' Elite' });
  c.sections = m.sections.map(sec => sec.type !== 'main' ? sec : Object.assign({}, sec, { blocks:sec.blocks.map(b => Object.assign({}, b, { repeat:b.repeat + 1 })) }));
  return c;
}

  const get = () => document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
  function apply(t, animate){

  btn.onclick = () => { const t = get() === 'light' ? 'dark' : 'light'; try { localStorage.setItem('apc.theme', t); } catch(e){} apply(t, true); };
  apply(get(), false);
  return { get, apply };
})();
