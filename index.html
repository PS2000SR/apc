/* Layout: Arena bei Nacht. Ein-Bildschirm-App, pro Screen eine dominante Aufgabe; Eisfeld-Markierungen (Blaue Linie, Rote Linie, Bully-Kreis) als Gestaltungssprache. */
:root{
  --ink:#09111F;        /* Arena-Dunkel */
  --panel:#101A2C;
  --panel-2:#16223A;
  --line:#25334E;
  --text:#ECF1F8;
  --muted:#8697B3;
  --ice:#7FD4FF;        /* Akzent: Eis */
  --on-ice:#061220;
  --red:#FF4458;        /* Rote Linie / Live */
  --blue:#3D6BFF;       /* Blaue Linie */
  --ok:#3FE0A5;
  --bronze:#D9935A; --bronze-d:#B8723D;
  --silver:#D3DCE8; --silver-d:#A3B1C6;
  --gold:#F4C64E;   --gold-d:#D6A21E;
  --tennis:#C9E265;
  --skin:#E2AE88; --skin-2:#B98663;
  --jersey:#EEF3FA; --jersey-2:#AEBBCF;
  --shorts:#2F4A80; --shorts-2:#223660;
  --sock:#F4F7FB; --sock-2:#B7C2D3;
  --shoe:#E8404F; --hair:#3A2A20;
  --scrim:rgba(5,9,18,.9);
  --glass:rgba(16,26,44,.78);
  --veil-top:rgba(9,17,31,.22);
  --veil-bot:rgba(9,17,31,.9);
  --veil-train:rgba(9,17,31,.86);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}

}

#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--veil-top) 0%,var(--veil-bot) 75%);transition:background .6s ease}
body.training #bg::after{background:var(--veil-train)}
#app{
  position:relative;z-index:1;height:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px 14px;
}
main{flex:1;min-height:0;display:flex}

/* ---------- Kopfzeile ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:2px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.mark{display:flex;gap:3px;height:24px}
.mark i{width:4px;border-radius:2px;background:var(--blue)}
.mark i:nth-child(2){background:var(--red)}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:.06em;line-height:1}
.brand span{font-family:var(--f-display);font-weight:600;font-size:.85rem;color:var(--muted);letter-spacing:.18em;text-transform:uppercase}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tog{
  display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:6px 12px;border-radius:8px;
  background:transparent;border:1px solid var(--line);color:var(--text);cursor:pointer;
  font-family:var(--f-display);font-weight:700;font-size:.9rem;letter-spacing:.1em;text-transform:uppercase;
}
.tog::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.tog[aria-pressed="false"]{color:var(--muted)}
.tog[aria-pressed="false"]::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
#tog-fs::before,#btn-home::before{display:none}
#btn-home{border-color:var(--ice);color:var(--ice)}
#btn-home svg{width:16px;height:16px;flex:none}
@media (max-width:520px){.brand span{display:none}.toggles{gap:4px}.tog{padding:5px 8px;gap:6px;font-size:.78rem;letter-spacing:.04em;min-height:34px}#tog-fs{display:none}#btn-home .lbl{display:none}}

/* ---------- Grundtypo ---------- */

#intro.weg{opacity:0;pointer-events:none}
#intro .i-bg{position:absolute;inset:0;background:var(--prog-img) center/cover no-repeat;animation:iZoom 7s ease-out both}
#intro .i-dim{position:absolute;inset:0;background:rgba(9,17,31,.55)}
#intro svg{position:absolute;left:0;top:60%;width:100%;height:90px}
#intro path{fill:none;stroke:var(--red);stroke-width:1.5;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:iPuls 2.6s ease-in-out forwards,iPulsFade 7s forwards}
#intro .i-t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 24px;color:#fff;font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.18em;font-size:clamp(1.6rem,4.6vw,3rem);line-height:1.15;opacity:0;animation:iTitel 1.2s ease-out 2.2s forwards}
#intro.boom{background:transparent;cursor:default;pointer-events:none}
#intro.boom .i-bg,#intro.boom .i-dim,#intro.boom svg{display:none}
#intro .i-shard{position:absolute;inset:0;background:linear-gradient(rgba(9,17,31,.55),rgba(9,17,31,.55)),var(--prog-img) center/cover no-repeat;-webkit-animation:iShard 1.9s cubic-bezier(.2,.6,.35,1) forwards;animation:iShard 1.9s cubic-bezier(.2,.6,.35,1) forwards;will-change:transform,opacity}
@-webkit-keyframes iShard{0%{-webkit-transform:none;opacity:1}60%{opacity:1}100%{-webkit-transform:translate(var(--tx),var(--ty)) rotate(var(--rot));opacity:0}}
@keyframes iShard{0%{transform:none;opacity:1}60%{opacity:1}100%{transform:translate(var(--tx),var(--ty)) rotate(var(--rot));opacity:0}}
#intro .i-flash{position:absolute;left:50%;top:48%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#fff;opacity:0;animation:iFlash .5s ease-out forwards}
#intro.boom .i-t{z-index:2;animation:iTitelBoom 1s ease-in forwards;opacity:1}
@keyframes iFlash{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(40)}}
/* Intro bewusst auch bei «Bewegung reduzieren» vollständig abspielen (übersteuert die globale Regel) */
@media (prefers-reduced-motion:reduce){#intro{transition-duration:.3s!important}#intro .i-bg{animation-duration:7s!important}#intro path{animation-duration:2.6s,7s!important}#intro .i-t{animation-duration:1.2s!important}#intro.boom .i-t{animation-duration:1s!important}#intro .i-shard{animation-duration:1.9s!important}#intro .i-flash{animation-duration:.5s!important}}
@keyframes iTitelBoom{from{opacity:1;transform:scale(1);letter-spacing:.18em}to{opacity:0;transform:scale(1.7);letter-spacing:.5em}}
@keyframes iZoom{from{transform:scale(1.08)}to{transform:scale(1)}}
@keyframes iPuls{to{stroke-dashoffset:0}}
@keyframes iPulsFade{0%,40%{opacity:.75}100%{opacity:.3}}
@keyframes iTitel{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}


.inner{margin:auto 0;width:100%;display:flex;flex-direction:column;align-items:center;gap:20px;padding-block:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:.95;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h1{font-size:clamp(2.6rem,7.5vw,4.6rem)}
h2{font-size:clamp(2rem,5.2vw,3rem)}
h3{font-size:clamp(1.6rem,4vw,2.2rem)}
p{margin:0}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:.95rem;text-transform:uppercase;letter-spacing:.2em;color:var(--ice)}
.eyebrow.red{color:var(--red)}
.muted{color:var(--muted)}
.lead{font-size:clamp(1.1rem,2.6vw,1.3rem);max-width:40ch}

.btn{
  font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:.1em;text-transform:uppercase;
  min-height:58px;padding:12px 30px;border-radius:10px;border:0;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:12px;transition:transform .08s ease,background .15s ease;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--ice);color:var(--on-ice)}
.btn-primary:hover{background:var(--text)}
.btn-ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line);font-size:1.05rem;min-height:50px}
.btn-danger{background:transparent;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red);font-size:1.05rem;min-height:50px}
.btn-small{min-height:42px;font-size:.95rem;padding:8px 16px}
.arrow{display:inline-block;width:20px;height:2px;background:currentColor;position:relative}
.arrow::after{content:"";position:absolute;right:0;top:-4px;width:8px;height:8px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(45deg)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--ice);outline-offset:3px}

/* ---------- Figur ---------- */
.fig{width:100%;height:100%;display:block;overflow:visible}
.f-limb,.f-torso{fill:none;stroke:var(--text);stroke-linecap:round;stroke-linejoin:round}
.f-limb{stroke-width:9}
.f-torso{stroke-width:12}
.f-back{opacity:.4}
.f-head{fill:var(--text)}
.f-shadow{fill:#000;opacity:.5;filter:url(#softT)}
.fig [class^="b-"]{stroke:none}
.b-skin{fill:var(--skin)} .b-skin2{fill:var(--skin-2)}
.b-jersey{fill:var(--jersey)} .b-jersey2{fill:var(--jersey-2)}
.b-shorts{fill:var(--shorts)} .b-shorts2{fill:var(--shorts-2)}
.b-sock{fill:var(--sock)} .b-sock2{fill:var(--sock-2)}
.b-shoe{fill:var(--shoe)}
.fig .b-hair{stroke:none}
.b-hair{fill:var(--hair)}
.fig .b-eye{fill:var(--ink);stroke:none}
.fig .b-trim{fill:none;stroke:var(--red);stroke-width:3}
.f-ground{stroke:var(--line);stroke-width:2}

/* Bully-Kreis */
.faceoff{position:relative;display:grid;place-items:center}
.faceoff > svg{position:absolute;inset:0;width:100%;height:100%}
.fo-ring{fill:none;stroke:var(--red);stroke-width:3}
.fo-hash{stroke:var(--red);stroke-width:3}
.fo-dot{fill:var(--red)}

/* ---------- Mission Center ---------- */
.hello{width:100%;max-width:880px;display:flex;flex-direction:column;gap:6px}
.mission-card{
  width:100%;max-width:880px;display:grid;grid-template-columns:260px minmax(0,1fr);
  background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;overflow:hidden;
}
.mc-art{position:relative;background:var(--panel-2);padding:18px;display:grid;place-items:center;border-right:1px solid var(--line)}
.mc-art::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:var(--red);opacity:.35}
.mc-art .demo{width:200px;max-width:100%;aspect-ratio:1;position:relative}
.mc-body{padding:26px 28px;display:flex;flex-direction:column;gap:12px;min-width:0}
.meta{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:0}
.meta li{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;padding:0 14px;border-left:1px solid var(--line)}
.meta li:first-child{padding-left:0;border-left:0}
.meta b{color:var(--ice)}
.mc-body .btn{align-self:flex-start;margin-top:8px}
@media (max-width:680px){
  .mission-card{grid-template-columns:1fr}
  .mc-art{border-right:0;border-bottom:1px solid var(--line)}
  .mc-art .demo{width:160px}
  .mc-body{padding:20px}
  .mc-body .btn{align-self:stretch}
}
.stats{width:100%;max-width:880px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat small{font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.16em}
.stat b{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;font-size:.5em;color:var(--muted)}
.lvbar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.lvbar span{display:block;height:100%;background:var(--ice)}
@media (max-width:480px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1 / -1}}
.parents{width:100%;max-width:880px;color:var(--muted);font-size:.95rem}
.parents summary{cursor:pointer;font-family:var(--f-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:6px 0}
.pbox{margin-top:8px;padding:16px 18px;border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:12px}
.pbox label{display:flex;gap:10px;align-items:center;cursor:pointer;color:var(--text)}
.pbox input{width:22px;height:22px;accent-color:var(--ice)}
.pbox.backup .eyebrow{margin:0}
.pbox.backup p{margin:0}
.bk-row{display:flex;flex-wrap:wrap;gap:10px}
#bk-msg{color:var(--text);min-height:1.2em}

/* ---------- Briefing ---------- */
.brief{max-width:880px;align-items:stretch}
.coach{display:flex;gap:14px;align-items:flex-start;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-left:4px solid var(--ice);border-radius:12px;padding:14px 18px;max-width:720px;text-align:left}
.coach .tag{flex:none;font-family:var(--f-display);font-weight:800;font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:var(--on-ice);background:var(--ice);border-radius:4px;padding:3px 8px;margin-top:3px}
.coach p{font-size:clamp(1.1rem,2.6vw,1.3rem);font-weight:600}
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stages li{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.stages .no{font-family:var(--f-display);font-weight:800;font-size:1rem;color:var(--ice);letter-spacing:.12em}
.stages b{font-family:var(--f-display);font-weight:800;font-size:1.6rem;text-transform:uppercase;line-height:1}
.stages small{color:var(--muted)}
.actions{display:flex;gap:12px;flex-wrap:wrap}
@media (max-width:560px){.stages{grid-template-columns:1fr}.actions .btn{flex:1 1 100%}}

/* ---------- Player ---------- */
#screen-player{overflow:hidden}
.ptop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;padding-block:10px 6px}
.chip{font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip em{font-style:normal;color:var(--ice);margin-left:8px}
.rink{position:relative;height:8px;border-radius:4px;background:var(--panel-2);overflow:visible}
.rink .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;background:var(--ice);transition:width .3s linear}
.rink .tick{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1px;border-radius:2px;background:var(--blue)}
.rink .mid{position:absolute;top:-5px;bottom:-5px;left:50%;width:3px;margin-left:-1px;border-radius:2px;background:var(--red);opacity:.6}
@media (max-width:560px){.ptop{grid-template-columns:minmax(0,1fr) auto}.rink{grid-column:1 / -1;grid-row:2}}
.stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.stage .inner{text-align:center;gap:16px}

.demo{position:relative;width:min(70vw,34vh,300px);aspect-ratio:1;max-width:100%}
.ring{position:relative;width:min(64vw,34vh,300px);aspect-ratio:1;max-width:100%}
.ring > svg.rs{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--panel-2);stroke-width:7}
.ring .arc{fill:none;stroke:var(--red);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .12s linear}
.ring.water .arc{stroke:var(--ice)}
.ring.rest .arc{stroke:var(--blue)}
.ring .figwrap{position:absolute;inset:11%}
.ring .rnum{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(3.5rem,13vw,5.5rem);font-variant-numeric:tabular-nums;line-height:1}
.ring.small{width:min(40vw,22vh,180px)}
.ring.small .rnum{font-size:clamp(2.6rem,9vw,3.8rem)}
.secs{font-family:var(--f-display);font-weight:800;font-size:clamp(4.5rem,15vw,8rem);line-height:.85;font-variant-numeric:tabular-nums}
.secs small{font-size:.22em;letter-spacing:.2em;color:var(--muted);margin-left:6px}
.caption{font-family:var(--f-display);font-weight:800;font-size:1.4rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ice);min-height:1.2em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips span{font-family:var(--f-display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.95rem;padding:5px 12px;border:1px solid var(--line);border-radius:6px}
.prevbar{width:min(360px,80%);height:4px;border-radius:2px;background:var(--panel-2);overflow:hidden}
.prevbar span{display:block;height:100%;width:0;background:var(--ice)}
.next{color:var(--muted);font-family:var(--f-display);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.next b{color:var(--text)}
.stage .coach{margin:0 auto}
.digit-wrap{width:min(70vw,40vh,320px);aspect-ratio:1;max-width:100%}
.digit{position:relative;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:clamp(7rem,30vw,12rem);line-height:1;font-variant-numeric:tabular-nums;animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
.digit.go{color:var(--red)}
@keyframes pop{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
.cd-row{display:flex;align-items:center;gap:24px;justify-content:center;flex-wrap:wrap}
.cd-row .demo{width:min(40vw,26vh,200px)}

/* Zwei-Spalten auf Tablet/Laptop quer */
@media (min-width:860px) and (min-aspect-ratio:5/4){
  .split{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:56px;text-align:left}
  .split .side{display:flex;flex-direction:column;align-items:flex-start;gap:16px;min-width:0;text-align:left}
  .split .ring{width:min(40vw,62vh,440px)}
  .split .demo{width:min(38vw,58vh,400px)}
  .split .ring.small{width:min(26vw,40vh,260px)}
  .split .chips{justify-content:flex-start}
  .split .coach{margin:0}
  .split .prevbar{width:100%}
}
.side{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}

/* Profi-Karte */
.pcard{position:relative;overflow:hidden;width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px;text-align:left;display:flex;flex-direction:column;gap:8px}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
.pnum{position:absolute;right:-6px;top:-18px;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:9rem;line-height:1;color:transparent;-webkit-text-stroke:2px var(--line);pointer-events:none}
.pname{position:relative;font-size:clamp(2rem,5vw,2.8rem)}
.pname span{display:block;font-size:.55em;color:var(--muted)}
.pmeta{position:relative;font-family:var(--f-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ice)}
.pfact{position:relative;font-size:1.1rem;font-weight:600}
.ptip{position:relative;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.done-badge{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ok)}
.done-badge i{width:26px;height:26px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.done-badge i::after{content:"";width:10px;height:5px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px)}
.xp-gain{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:clamp(3rem,10vw,5rem);color:var(--ice);font-variant-numeric:tabular-nums;line-height:1}
.ptools{display:flex;justify-content:center}

/* ---------- Pause ---------- */
.overlay{position:fixed;inset:0;z-index:20;background:var(--scrim);display:grid;place-items:center;padding:20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 24px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.panel .btn{width:100%}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}

/* ---------- Kopf Mission Center ---------- */
.hello-row{width:100%;max-width:880px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hello-row .hello{width:auto;min-width:0}
.trophy-btn{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 12px;border-radius:12px;cursor:pointer;
  background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);color:var(--text);font:inherit;text-align:left;transition:border-color .15s ease}
.trophy-btn:hover{border-color:var(--ice)}
.trophy-btn .badge{width:38px;flex:none}
.trophy-btn small{display:block;font-family:var(--f-display);font-weight:700;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.trophy-btn b{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--ice)}
.all-trainings{width:100%;max-width:880px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px;border-radius:12px;cursor:pointer;
  background:transparent;border:1.5px dashed var(--line);color:var(--text);font:inherit;text-align:left;transition:border-color .15s ease}
.all-trainings:hover{border-color:var(--ice)}
.all-trainings b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:.08em;text-transform:uppercase}
.all-trainings small{color:var(--muted)}
.all-trainings .arrow{color:var(--ice)}

/* ---------- Briefing oben ---------- */
.brief-top{justify-content:space-between;align-items:center}
@media (max-width:560px){.actions.brief-top .btn{flex:1 1 0;padding-left:12px;padding-right:12px;font-size:1.05rem}}

/* ---------- Einplanen ---------- */
.plan-pick{display:flex;flex-direction:column;gap:8px}
.pp-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.pp-day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:10px;cursor:pointer;min-width:0;
  background:var(--glass);border:1px solid var(--line);color:var(--text);font:inherit}
.pp-day b{font-family:var(--f-display);font-weight:800;font-size:1.15rem;text-transform:uppercase}
.pp-day small{font-size:.7rem;color:var(--muted);text-align:center;line-height:1.15;overflow-wrap:anywhere}
.pp-day.on{background:var(--ice);border-color:var(--ice);color:var(--on-ice)}
.pp-day.on small{color:var(--on-ice)}
.pp-hint{font-size:.88rem}

/* ---------- Gamifikation ---------- */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:30;max-width:min(560px,calc(100% - 32px));
  background:var(--panel);border:1px solid var(--ice);border-radius:12px;padding:12px 16px;color:var(--text);box-shadow:0 10px 30px rgba(0,0,0,.4);font-size:.95rem}
.toast b{font-family:var(--f-display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ice);margin-right:6px}
.ovr-mini{display:grid;place-items:center;width:38px;height:38px;border-radius:8px;background:var(--gold);color:var(--on-ice);font-family:var(--f-display);font-weight:800;font-size:1.25rem;flex:none}
.season-card{width:100%;max-width:880px;display:grid;grid-template-columns:minmax(0,1fr) 160px auto;align-items:center;gap:16px;padding:14px 22px;border-radius:12px;cursor:pointer;
  background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);color:var(--text);font:inherit;text-align:left}
.season-card:hover{border-color:var(--ice)}
.season-card.po{border-color:var(--red)}
.season-card.champ{border-color:var(--gold)}
.sc-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.sc-l small{color:var(--muted)}
.sc-l b{font-family:var(--f-display);font-weight:800;font-size:1.4rem;text-transform:uppercase;line-height:1.05}
.sc-bar{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}

  color:var(--on-ice);background:var(--ice);border:0;border-radius:999px;padding:8px 18px;cursor:pointer}

/* ---------- Übungssets ---------- */
.equip-line{color:var(--muted);font-size:.95rem}
.equip-line b,.trains b,.tipline b{font-family:var(--f-display);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem;color:var(--ice);margin-right:6px}
.trains{color:var(--muted)}
.tipline{max-width:46ch;color:var(--text);background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.callbox{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,7vw,3.2rem);text-transform:uppercase;letter-spacing:.04em;line-height:1;
  padding:10px 22px;border-radius:12px;border:3px solid var(--ice);color:var(--text);background:var(--glass);font-variant-numeric:tabular-nums}
.callbox.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both}
.callbox.c-red{border-color:var(--red);color:var(--red)}
.callbox.c-blue{border-color:var(--blue);color:var(--blue)}
.callbox.c-green{border-color:var(--ok);color:var(--ok)}
.callbox.c-yellow{border-color:var(--gold);color:var(--gold)}
.brief-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.load-high,.load-hoch{color:var(--red)} .load-mittel{color:var(--gold)} .load-niedrig{color:var(--ok)}
.load-note{color:var(--muted);font-size:.95rem}
@media (max-width:900px){.brief-facts{grid-template-columns:1fr 1fr}}
.brief-facts span{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.brief-facts small,.equip small{font-family:var(--f-display);font-weight:700;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.brief-facts b{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:.03em}
.equip{display:flex;flex-direction:column;gap:6px}
.equip .chips{justify-content:flex-start}
.why{background:var(--glass);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:12px 16px}
.why b{font-family:var(--f-display);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.plan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.plan{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-top:4px solid var(--ok);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.plan.sec-main{border-top-color:var(--red)}
.plan.sec-cooldown{border-top-color:var(--blue)}
.plan .no{font-family:var(--f-display);font-weight:700;font-size:.85rem;letter-spacing:.12em;color:var(--muted)}
.plan > b{font-family:var(--f-display);font-weight:800;font-size:1.5rem;text-transform:uppercase;line-height:1}
.plan ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.plan li span{display:block;font-weight:600;line-height:1.25}
.plan li small{color:var(--muted);font-variant-numeric:tabular-nums}
.challenge{background:var(--glass);border:1px solid var(--gold);border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.challenge > b{font-family:var(--f-display);font-weight:800;font-size:1.5rem;text-transform:uppercase;color:var(--gold)}
.challenge ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted)}
.stars{color:var(--gold);margin-right:6px;letter-spacing:.1em}
@media (max-width:760px){.plan-grid{grid-template-columns:1fr}.brief-facts{grid-template-columns:1fr}}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.lib-tile{position:relative;display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:center;text-align:left;cursor:pointer;
  background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 12px;color:var(--text);font:inherit;transition:border-color .15s ease}
.lib-tile:hover:not([disabled]){border-color:var(--ice)}
.lib-tile.today{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.lib-tile[disabled]{cursor:default;opacity:.55}
.lt-no{position:absolute;top:8px;left:10px;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:1.4rem;color:var(--ice);line-height:1;z-index:1}
.lt-fig{width:86px;aspect-ratio:1;background:var(--panel-2);border-radius:10px}
.lt-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.lt-eyebrow{font-family:var(--f-display);font-weight:700;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.lib-tile.today .lt-eyebrow{color:var(--red)}
.lib-tile.done .lt-eyebrow{color:var(--ok)}
.lt-txt b{font-family:var(--f-display);font-weight:800;font-size:1.3rem;text-transform:uppercase;line-height:1}
.lt-txt small{color:var(--muted);font-size:.86rem;line-height:1.3}
.lt-meta{font-size:.8rem;color:var(--ice);font-variant-numeric:tabular-nums}
.lib{max-width:1100px}

/* ---------- Geräte der Animationen ---------- */
.p-cone{fill:var(--red)}
.p-cone.blue{fill:var(--blue)} .p-cone.green{fill:var(--ok)} .p-cone.yellow{fill:var(--gold)}
.p-wall{fill:var(--panel-2);stroke:var(--line);stroke-width:2}
.p-ball{stroke:none}
.p-ball.tennis{fill:var(--tennis)} .p-ball.red{fill:var(--red)} .p-ball.med{fill:var(--bronze-d)}
.p-mat{fill:var(--blue);opacity:.35}
.p-board{fill:var(--bronze)}
.p-roller{fill:var(--line);stroke:var(--muted);stroke-width:2}
.p-pod{fill:var(--panel-2);stroke:var(--muted);stroke-width:2}
.p-pod.lit{fill:var(--ice);stroke:var(--ice)}
.p-ladder{stroke:var(--gold);stroke-width:2.5}
.p-box{fill:var(--panel-2);stroke:var(--line);stroke-width:2}
.p-boxtop{fill:var(--gold)}
.p-hurdle{fill:none;stroke:var(--gold);stroke-width:4;stroke-linejoin:round}
.p-band{stroke:var(--red);stroke-width:3;stroke-linecap:round}
.p-pad{fill:var(--blue)}
.p-rope{fill:none;stroke:var(--ice);stroke-width:2.5}
.p-stick{stroke:var(--bronze);stroke-width:5;stroke-linecap:round}
.p-blade{stroke:var(--bronze-d);stroke-width:7;stroke-linecap:round}
.p-puck{fill:var(--muted)}
.p-impact{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round}

/* ---------- Abzeichen ---------- */
.badge{width:100%;height:auto;display:block}
.badge.bronze{--t:var(--bronze);--td:var(--bronze-d)}
.badge.silver{--t:var(--silver);--td:var(--silver-d)}
.badge.gold{--t:var(--gold);--td:var(--gold-d)}
.badge .b-out{fill:var(--t)}
.badge .b-in{fill:var(--td)}
.badge .b-shine{fill:var(--text);opacity:.16}
.badge .b-g{fill:var(--ink);stroke:var(--ink);stroke-width:0}
.badge .gs{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.badge .gt{font-family:var(--f-display);font-weight:800;text-anchor:middle;stroke-width:0}
.badge.off .b-out{fill:var(--panel-2)}
.badge.off .b-in{fill:var(--panel)}
.badge.off .b-shine{opacity:0}
.badge.off .b-g{fill:var(--line);stroke:var(--line)}
.cabinet{width:100%;max-width:880px;display:flex;flex-direction:column;gap:12px}
.cab-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.cab-head .count{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:.08em;color:var(--ice);font-variant-numeric:tabular-nums}
.bgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:640px){.bgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bdg{background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--text);font:inherit;text-align:center;min-width:0}
.bdg .badge{width:64px}
.bdg .bn{font-family:var(--f-display);font-weight:700;font-size:.92rem;letter-spacing:.03em;text-transform:uppercase;line-height:1.05;max-width:100%;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.bdg .bs{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bdg:not(.on) .bn{color:var(--muted)}
.bdg[aria-pressed="true"]{border-color:var(--ice)}
.bdetail{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;gap:16px;align-items:center}
.bdetail .badge{width:72px;flex:none}
.bdetail .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.bdetail b{font-family:var(--f-display);font-weight:800;font-size:1.5rem;text-transform:uppercase;line-height:1}
.bdetail .lvbar{width:min(240px,100%)}
.bdetail .pcard{max-width:none}
.album{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.mcard{position:relative;aspect-ratio:3/4;border-radius:10px;border:1px solid var(--line);background:var(--panel);overflow:hidden;cursor:pointer;color:var(--text);font:inherit;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
.mcard.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
.mcard .mnum{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:clamp(1.4rem,4.5vw,2.2rem);line-height:1}
.mcard .mnm{font-family:var(--f-display);font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.mcard:not(.on) .mnum{color:var(--line)}
.mcard[aria-pressed="true"]{border-color:var(--ice)}
@media (max-width:560px){.album{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rewards{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;max-width:900px}
.rw{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px;animation:reveal .7s cubic-bezier(.2,.9,.3,1.2) both}
.rw .badge{width:110px}
.rw .mcard{width:96px;cursor:default}
.rw b{font-family:var(--f-display);font-weight:800;font-size:1.25rem;text-transform:uppercase;line-height:1}
.rw small{color:var(--muted)}
@keyframes reveal{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
/* ===== Mission Center 2.0 (Konzept D: Coach fragt) ===== */
.mc2{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
@media (max-width:900px){.mc2{grid-template-columns:minmax(0,1fr)}}
.mc2-main{display:flex;flex-direction:column;gap:18px;min-width:0}
.mc2-coach{display:flex;gap:16px;align-items:flex-start}
.mc2-av{width:64px;height:64px;flex:none;border-radius:50%;background:var(--panel-2);border:2px solid var(--ice);display:grid;place-items:center;color:var(--ice)}
.mc2-av svg{width:34px;height:34px}
.mc2-bubble{background:var(--panel-2);border-radius:4px 20px 20px 20px;padding:14px 22px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mc2-coach .mc2-bubble{flex:1 1 auto;border-radius:22px;border:1px solid var(--line);padding:16px 24px}   /* ohne Pfeifen-Symbol: bündig mit der Trainingskarte */
.mc2-bubble h1{font-size:clamp(1.8rem,3.6vw,2.5rem);line-height:1;text-transform:none}
.mc2-bubble small{color:var(--muted);font-size:.95rem}
.mc2-ctx{display:flex;gap:8px;flex-wrap:wrap}
.mc2-ctx span{padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:.95rem}
.mc2-ctx .ice{border-color:var(--blue)}.mc2-ctx .game{border-color:var(--red)}
.mc2-feels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:640px){.mc2-feels{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Feedback nach dem Training und Schmerzmodus */
.fbk{position:fixed;inset:0;z-index:500;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.fbk-card{width:min(760px,100%);margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:18px;text-align:center}
.fbk-card h2{text-transform:none}
.fbk-opts{display:grid;gap:12px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
@media (max-width:560px){.fbk-opts.n5{grid-template-columns:repeat(3,minmax(0,1fr))}.fbk-opts.n6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fbk-o{min-height:112px;border-radius:16px;border:2px solid var(--line);background:var(--panel-2);color:var(--text);font:inherit;font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:10px}
.fbk-o:active{transform:scale(.97)}
.fbk-o svg{width:44px;height:44px}
.fbk-o.ok{border-color:var(--ok)}.fbk-o.bad{border-color:var(--red)}
.fbk-o small{font-family:var(--f-body);font-weight:500;font-size:.85rem;letter-spacing:0;text-transform:none;color:var(--muted)}
.fbk-body{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:560px){.fbk-body{grid-template-columns:1fr}}
.pfig{width:100%;max-height:min(62vh,460px);display:block;margin:0 auto}
.pfig .pr{fill:var(--skin);stroke:var(--skin-2);stroke-width:.8;cursor:pointer;transition:fill .15s}
.pfig .pr:hover{fill:#D49A72}
.pfig .pr.sel{fill:var(--red);stroke:#B0182A}
.pfig .deco{pointer-events:none}
.pfig text{font-size:11px;fill:var(--muted)}
.fbk-side{display:flex;flex-direction:column;gap:14px}
.pchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:40px;align-items:center}
.pchip{background:var(--red);color:#fff;border:0;border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.fbk-o.pback{min-height:56px}
.fbk-o.on{border-color:var(--gold);background:rgba(244,198,78,.12)}
.fbk-o.bad.on{border-color:var(--red);background:rgba(255,68,88,.18)}
.plrow{display:flex;flex-direction:column;gap:8px;text-align:left}
.plrow b{font-family:var(--f-display);font-size:1.3rem;text-transform:uppercase;letter-spacing:.04em}
.plrow .fbk-o{min-height:72px}
.btn[disabled]{opacity:.45}
/* Demomodus */
#demo{position:fixed;inset:0;z-index:700;background:transparent}
#demo .d-cap{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(720px,calc(100% - 32px));background:var(--scrim);border:1.5px solid var(--ice);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;color:var(--text)}
#demo .d-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
#demo .d-tag{font-family:var(--f-display);font-weight:800;letter-spacing:.18em;color:var(--ice);font-size:.9rem;text-transform:uppercase}
#demo .d-txt{font-size:1.15rem;font-weight:600;line-height:1.35}
#demo .d-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
#demo .d-bar span{display:block;height:100%;width:0;background:var(--ice)}
.demo-hl{outline:3px solid var(--ice);outline-offset:4px;border-radius:18px}
.fbk-skip{align-self:center;background:none;border:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;padding:6px}
.pain-follow{border-radius:18px;border:2px solid var(--red);background:var(--panel);padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.pain-follow h3{text-transform:none;font-size:clamp(1.4rem,3vw,1.8rem)}
.pain-follow div{display:flex;gap:10px;flex-wrap:wrap}
.mc2-rec.pain-pause{grid-template-columns:1fr;border-color:var(--red)}
.pain-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.pain-list li{display:flex;justify-content:space-between;gap:12px;color:var(--text);border-bottom:1px solid var(--line);padding:4px 0}
.pain-alert{color:var(--text);border-left:4px solid var(--red);padding-left:10px}
.strain-row{display:flex;gap:6px;align-items:flex-end;height:60px}
.strain-row span{flex:1;max-width:28px;border-radius:4px 4px 0 0;background:var(--ice)}
/* Analytics */
.an-box{width:100%;max-width:880px;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.an-box h3{font-size:clamp(1.3rem,3vw,1.6rem)}
.an-box svg{width:100%;height:auto;display:block}
.an-legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:.9rem}
.an-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.an-hints{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--text)}
.an-bars{display:flex;flex-direction:column;gap:8px}
.an-bar{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:10px;align-items:center;color:var(--text)}
.an-bar div{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.an-bar div span{display:block;height:100%;border-radius:7px}
.an-bar b{text-align:right;font-family:var(--f-display)}
.an-empty{color:var(--muted)}
/* Club-Protokoll (On-Ice, Off-Ice, Match) und Abweichungen vom Wochenplan */
.clc{gap:6px}
.clc-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.clc-head .eyebrow{margin:0}.clc-head .muted{font-size:.85rem}
.cl-dayblk{border-top:1px solid var(--line);padding-top:6px}
.cl-day{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ice);margin:0 0 2px;font-size:.95rem;display:flex;gap:10px;align-items:center}
.cl-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 10px;align-items:center;padding:3px 0}
.cl-lbl{display:flex;flex-direction:column;line-height:1.1}
.cl-lbl b{font-family:var(--f-display);font-size:1.05rem;text-transform:uppercase;letter-spacing:.03em}
.cl-lbl small{color:var(--muted);font-size:.8rem}
.cl-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cl-o{min-height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel-2);color:var(--text);font:700 .85rem var(--f-display);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;padding:2px 6px;display:flex;align-items:center;justify-content:center;gap:6px}
.cl-o i{font-style:normal;font-size:1rem;opacity:.7}
.cl-o.done[aria-pressed="true"]{border-color:var(--ok);background:rgba(63,224,165,.18)}
.cl-o.missed[aria-pressed="true"]{border-color:var(--red);background:rgba(255,68,88,.18)}
.cl-o.cancelled[aria-pressed="true"]{border-color:var(--muted);background:rgba(134,151,179,.22)}
.cl-o[aria-pressed="true"] i{opacity:1}
.cl-why{grid-column:2;display:flex;flex-wrap:wrap;gap:6px}
.cl-r{min-height:32px;padding:3px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:600 .85rem var(--f-body);cursor:pointer}
.cl-r[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.cl-link{background:none;border:0;color:var(--ice);font:600 .9rem var(--f-body);cursor:pointer;padding:4px 0;text-transform:none;letter-spacing:0}
.cl-done{border-top:1px solid var(--line);padding-top:6px}

/* =====================================================================
   TIEFE – Licht & Schatten (3D-Wirkung)
   Licht kommt von oben: helle Oberkante, dunkle Unterkante, mehrstufige weiche Schatten.
   Drei Ebenen: --e1 (kleine Elemente), --e2 (Karten), --e3 (Hauptkarten).
   ===================================================================== */
:root{
  --lit:inset 0 1px 0 rgba(255,255,255,.09), inset 0 -1px 0 rgba(0,0,0,.4);
  --e1:var(--lit), 0 1px 1px rgba(0,0,0,.35), 0 4px 10px -4px rgba(0,0,0,.55);
  --e2:var(--lit), 0 1px 2px rgba(0,0,0,.35), 0 8px 18px -6px rgba(0,0,0,.55), 0 22px 40px -20px rgba(0,0,0,.7);
  --e3:var(--lit), 0 2px 3px rgba(0,0,0,.35), 0 14px 28px -8px rgba(0,0,0,.6), 0 36px 64px -24px rgba(0,0,0,.8);
  --sheen:linear-gradient(180deg, rgba(255,255,255,.055) 0%, rgba(255,255,255,0) 38%, rgba(0,0,0,.14) 100%);
}
/* Hauptkarten */
.mc2-rec,.mission-card,.pcard,.season-card,.champ-banner,.panel,.lg-cal,.lg-list{box-shadow:var(--e3);background-image:var(--sheen)}
.player-card{box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 0 rgba(0,0,0,.2), 0 2px 3px rgba(0,0,0,.35), 0 14px 28px -8px rgba(0,0,0,.6), 0 36px 64px -24px rgba(0,0,0,.8)}
/* Karten */
.mc2-box,.mc2-bubble,.mc2-testdue,.test-banner,.all-trainings,.trophy-entry,.trophy-btn,.stat,.coach,.plan,.challenge,.callbox,.bdetail,
.lib-tile,.mcard,.pbox,.peditor,.pwarn,.toast,.rink,.why,.tipline,.test-cmp,.rec-brief{box-shadow:var(--e2);background-image:var(--sheen)}
/* Kleine Elemente */
.pday,.mc2-feel,.rec-row,.test-row,.bdg,.lg-day,.clip,.free-day,.pp-day,.mcard-style,.elite-tog,.voice-sel,.mc2-av,.lg-nav button,.pe-time,.peditor select,.pselect{box-shadow:var(--e1)}
.pday,.mc2-feel,.bdg,.lg-day,.free-day,.pp-day{background-image:var(--sheen)}
.mc2-chips span,.pc{box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 1px 2px rgba(0,0,0,.35)}
/* Zustände mit eigenem Rahmen-Schatten behalten diesen zusätzlich */
.pday.today{box-shadow:inset 0 0 0 1px var(--ice), var(--e1), 0 0 18px -6px rgba(127,212,255,.45)}
.lib-tile.today{box-shadow:inset 0 0 0 1px var(--red), var(--e2)}
.mcard-style.sel{box-shadow:inset 0 0 0 1px var(--ice), var(--e1)}
.lg-day.ice{box-shadow:inset 0 -3px 0 var(--blue), var(--e1)}
.lg-day.game{box-shadow:inset 0 -3px 0 var(--red), var(--e1)}
.mc2-feel[aria-pressed="true"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 -2px 0 rgba(0,0,0,.18), 0 2px 3px rgba(0,0,0,.35), 0 10px 22px -8px rgba(127,212,255,.55)}
.mc2-testdue{box-shadow:var(--e2), 0 0 26px -10px rgba(244,198,78,.6)}
/* Knöpfe: Volumen durch Verlauf und Licht */
.btn{transition:transform .12s ease, box-shadow .12s ease, background-color .12s ease}
.btn-primary{background-image:linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 55%, rgba(0,0,0,.08));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), inset 0 -2px 0 rgba(0,0,0,.18), 0 2px 3px rgba(0,0,0,.35), 0 10px 22px -8px rgba(127,212,255,.6)}
.btn-ghost{background-image:var(--sheen);box-shadow:inset 0 0 0 1.5px var(--line), var(--e1)}
.btn-danger{box-shadow:inset 0 0 0 1.5px var(--red), var(--e1)}
.btn:active,.mc2-feel:active,.mc2-testdue:active,.all-trainings:active{transform:translateY(1px) scale(.985)}
.btn-primary:active{box-shadow:inset 0 2px 4px rgba(0,0,0,.25), 0 1px 2px rgba(0,0,0,.3)}
.btn-ghost:active{box-shadow:inset 0 0 0 1.5px var(--line), inset 0 2px 4px rgba(0,0,0,.35)}
/* Navigation schwebt über dem Inhalt */
.tabbar{box-shadow:0 -1px 0 rgba(255,255,255,.04), 0 -14px 28px -18px rgba(0,0,0,.8)}
.tabbar button[aria-current="page"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 rgba(0,0,0,.35), 0 6px 16px -8px rgba(0,0,0,.6);background-image:linear-gradient(180deg, rgba(127,212,255,.08), rgba(127,212,255,0))}
/* Schrift mit Tiefe */
h1,h2,.mc2-rec h2{text-shadow:0 1px 0 rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.45)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}

/* =====================================================================
   HELLER MODUS (White) – umschaltbar oben rechts im Mission Center
   ===================================================================== */
html[data-theme="light"]{
  --panel:#FFFFFF; --panel-2:#EEF2F8; --line:#D2DBE8; --text:#0B1626; --muted:#56678A;
  --ice:#0A78BA; --on-ice:#FFFFFF; --red:#D42A3E; --blue:#2F5BE0; --ok:#0E9C72; --gold:#A87A06;
  --scrim:rgba(238,242,248,.94); --glass:rgba(255,255,255,.82);
  --veil-top:rgba(240,244,250,.30); --veil-bot:rgba(240,244,250,.80); --veil-train:rgba(240,244,250,.94);
  --lit:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(15,30,60,.06);
  --e1:var(--lit), 0 1px 1px rgba(15,30,60,.08), 0 3px 8px -3px rgba(15,30,60,.14);
  --e2:var(--lit), 0 1px 2px rgba(15,30,60,.08), 0 8px 18px -8px rgba(15,30,60,.18), 0 20px 36px -20px rgba(15,30,60,.22);
  --e3:var(--lit), 0 2px 3px rgba(15,30,60,.08), 0 12px 26px -10px rgba(15,30,60,.22), 0 32px 56px -26px rgba(15,30,60,.28);
  --sheen:linear-gradient(180deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,0) 40%, rgba(15,30,60,.025) 100%);
  color-scheme:light;
}
html[data-theme="light"] body{background:radial-gradient(90% 60% at 15% -10%, rgba(10,120,186,.10), transparent 60%), #EEF2F7}
html[data-theme="light"] #bg{background-color:#EEF2F7}

html[data-theme="light"] .tabbar{background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 -10px 24px -18px rgba(15,30,60,.35)}

<div id="intro" aria-hidden="true"><div class="i-bg"></div><div class="i-dim"></div><svg viewBox="0 0 1000 100" preserveAspectRatio="none"><path pathLength="1" vector-effect="non-scaling-stroke" d="M0 60 H440 L465 30 L490 85 L515 10 L540 75 L560 60 H1000"/></svg><div class="i-t">Athlete Performance Centre</div></div>
<script>(function(){
  var el=document.getElementById('intro'),done=false;
  var ruhig=false; /* Intro läuft bewusst auch bei «Bewegung reduzieren» vollständig */
  function aufraeumen(ms){setTimeout(function(){el.remove();},ms);}
  /* Ende: Bild zerspringt in Splitter, die nach aussen fliegen */
  function boom(){
    if(done)return;done=true;
    if(ruhig){el.classList.add('weg');aufraeumen(350);return;}
    var n=12,ring=document.createDocumentFragment(),parts=[];
    function rand(a,b){return a+Math.random()*(b-a);}
    function rp(a,r){var dx=Math.cos(a),dy=Math.sin(a),t=50/Math.max(Math.abs(dx),Math.abs(dy))*1.6*r;return[50+dx*t,50+dy*t];}
    var cx=50,cy=48,cuts=[];
    for(var k=0;k<n;k++)cuts.push((k+rand(-.3,.3))/n*Math.PI*2);
    for(var k=0;k<n;k++){
      var a1=cuts[k],a2=cuts[(k+1)%n]+(k===n-1?Math.PI*2:0),am=(a1+a2)/2,r=rand(.22,.4);
      var i1=rp(a1,r),i2=rp(a2,r),o1=rp(a1,1),o2=rp(a2,1);
      parts.push({poly:[[cx,cy],i1,i2],a:am,d:rand(25,45)});
      parts.push({poly:[i1,o1,o2,i2],a:am,d:rand(60,110)});
    }
    parts.forEach(function(p){
      var s=document.createElement('div');s.className='i-shard';
      var cp='polygon('+p.poly.map(function(q){return q[0].toFixed(1)+'% '+q[1].toFixed(1)+'%';}).join(',')+')';s.style.webkitClipPath=cp;s.style.clipPath=cp;
      s.style.setProperty('--tx',(Math.cos(p.a)*p.d).toFixed(1)+'vw');s.style.setProperty('--ty',(Math.sin(p.a)*p.d).toFixed(1)+'vh');s.style.setProperty('--rot',rand(-35,35).toFixed(0)+'deg');
      ring.appendChild(s);
      p.el=s;
    });
    el.appendChild(ring);
    var fl=document.createElement('div');fl.className='i-flash';el.appendChild(fl);
    el.classList.add('boom');
    aufraeumen(2000);
  }
  el.addEventListener('click',boom);
  setTimeout(boom,ruhig?3000:6700);
})();</script>

function makeSet(o){
  const id = 'set-' + String(o.n).padStart(2, '0');
  const firstMain = o.main ? o.main[0].steps[0] : null;
  const animOf = st => (st.o && st.o.anim) || (EXERCISES[st.ex] && EXERCISES[st.ex].anim) || st.ex;
  return {
    id, n:o.n, label:'Übungsset ' + o.n, title:o.title, tagline:o.tagline || '', description:o.desc, desc:o.desc,
    load:o.load || 'mittel', pillars:o.pillars || [], equipment:o.equipment || [], ort:o.ort || 'Home / Garage', dauer:o.dauer || '',
    why:o.why || null, challenge:o.challenge || null, tip:o.tip || null, playable:o.playable !== false,
    demo: firstMain ? animOf(firstMain) : 'jog',
    greeting:`Hallo ${PROFILE.name}! Übungsset ${o.n}: ${o.title}. Bereit?`,
    goal:o.desc, completionXP:100, previewSeconds:6, previewRepeatSeconds:4, countdownSeconds:3,
    sections: o.playable === false ? [] : [
      { id:'warmup', type:'warmup', title:'Warm-up', subtitle:o.wSub || 'Mach deinen Körper bereit!', music:'warmup',
        coachIntro:'Warm-up. ' + (o.wSub || 'Mach deinen Körper bereit!'), tip:o.wTip, blocks:[ { repeat:1, steps:o.warmup } ] },
      { id:'main', type:'main', title:'Hauptteil', subtitle:o.mSub, music:o.mMusic || 'main',
        coachIntro:'Hauptteil. ' + o.mSub, tip:o.tip, blocks:o.main },
      { id:'cooldown', type:'cooldown', title:'Cool-down', subtitle:o.cSub || 'Bring deinen Körper zur Ruhe.', music:'cooldown',
        coachIntro:'Cool-down. ' + (o.cSub || 'Bring deinen Körper zur Ruhe.'), tip:o.cTip, blocks:[ { repeat:1, steps:o.cooldown || COOL_STD() } ] }
    ]
  };
}

const LOAD_NOTE = {
  hoch:'Intensives Set mit Sprints oder Sprüngen. Nicht am Tag vor einem Spiel und nicht zwei Tage hintereinander. Qualität vor Menge: lieber aufhören, wenn die Technik nachlässt.',
  mittel:'Mittlere Belastung. Gut kombinierbar mit einem lockeren Eistraining am selben Tag.',

let MISSION = MISSIONS[0];   // aktuell gewähltes Übungsset

/* Coach-Ansagen während einer Übung (Farben, Zahlen, Rechnen …) */
const CALLS = (() => {
  const rnd = n => Math.floor(Math.random() * n);
  const COL = [ { text:'Rot', cls:'c-red' }, { text:'Blau', cls:'c-blue' }, { text:'Grün', cls:'c-green' }, { text:'Gelb', cls:'c-yellow' } ];
  const one = arr => () => { const c = arr[rnd(arr.length)]; return { text:c.text, say:c.say || c.text, cls:c.cls || '' }; };
  return {
    colors:{ every:3.5, gen:one(COL) },
    rgb:{ every:3, gen:one(COL.slice(0, 3)) },
    numbers:{ every:4, gen:() => { const n = 1 + rnd(10); return { text:String(n), say:String(n) }; } },
    math:{ every:7, gen:() => { const a = 1 + rnd(9), b = 1 + rnd(9), plus = Math.random() < .6 || a <= b;
      return plus ? { text:`${a} + ${b} = ?`, say:`${a} plus ${b}` } : { text:`${a} − ${b} = ?`, say:`${a} minus ${b}` }; } },
    go:{ every:5, gen:() => ({ text:'GO!', say:'Go!', cls:'c-red' }) },

   Sie laufen über den Effekt-Kanal und stoppen deshalb keine Musik aus Apple Music oder Spotify. */
const CLIPS = [
  { id:'ready', label:'Ready',          say:'«Ready…»',          when:'Zu Beginn des Countdowns vor jeder Übung' },
  { id:'go',    label:'Go',             say:'«Go!»',             when:'Letzte Countdown-Sekunde, kurz vor dem Horn' },
  { id:'three', label:'Three',          say:'«Three»',           when:'3 Sekunden vor Übungsende' },
  { id:'two',   label:'Two',            say:'«Two»',             when:'2 Sekunden vor Übungsende' },
  { id:'one',   label:'One',            say:'«One»',             when:'1 Sekunde vor Übungsende' },
  { id:'side',  label:'Seite wechseln', say:'«Seite wechseln!»', when:'Bei Übungen mit Seitenwechsel, nach der Hälfte' }
];
const CLIP_OF = { 'Ready…':'ready', 'Go!':'go', 'Three':'three', 'Two':'two', 'One':'one', 'Seite wechseln!':'side' };
const clipData = (() => { try { return JSON.parse(localStorage.getItem('apc.clips.v1') || '{}') || {}; } catch(e){ return {}; } })();
const clipBufs = {}; let clipErr = '';
function saveClips(){ try { localStorage.setItem('apc.clips.v1', JSON.stringify(clipData)); return true; } catch(e){ return false; } }
async function clipBuffer(id){
  if (clipBufs[id]) return clipBufs[id];
  const url = clipData[id]; if (!url) return null;
  try { const bin = atob(url.slice(url.indexOf(',') + 1)), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    clipBufs[id] = await Sound.decode(u8.buffer); clipErr = ''; return clipBufs[id]; } catch(e){ clipErr = id + ': ' + (e && e.message || e); return null; }
}
function preloadClips(){ CLIPS.forEach(c => { if (clipData[c.id]) clipBuffer(c.id); }); }
/* Kommando abspielen: eigene Aufnahme, sonst Sprachausgabe – ausser bei «Eigene Musik» (die würde Apple Music stoppen) */
function coachSay(text, lang){
  const id = CLIP_OF[text];
  if (id && clipData[id] && settings.voice){
    Sound.resume();
    if (clipBufs[id]) Sound.playClip(clipBufs[id]);
    else { const t0 = Date.now(); clipBuffer(id).then(b => { if (b && Date.now() - t0 < 600) Sound.playClip(b); }); }
    return;
  }
  if (!settings.music) return;     // «Eigene Musik»: keine Sprachausgabe, Text steht auf dem Bildschirm
  Voice.count(text, lang);
}

/* Eigene Musikdateien lokal speichern (nur auf diesem Gerät, IndexedDB) */
const MusicStore = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try { const r = indexedDB.open('apc-music', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('tracks', { keyPath:'id' });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch(e){ rej(e); } }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction('tracks', mode), st = t.objectStore('tracks'); const out = fn(st); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); }));
  let cache = [];
  return {
    async list(){ try { const all = await tx('readonly', st => st.getAll()); cache.forEach(c => URL.revokeObjectURL(c.url));
      cache = (all || []).sort((a, b) => a.added - b.added).map(r => ({ id:r.id, name:r.name, url:URL.createObjectURL(r.blob) })); } catch(e){ cache = []; } return cache; },
    async add(files){ for (const f of files){ try { await tx('readwrite', st => st.put({ id:Date.now() + '-' + Math.random().toString(36).slice(2), name:f.name.replace(/\.[^.]+$/, ''), blob:f, added:Date.now() })); } catch(e){} } return this.list(); },
    async remove(id){ try { await tx('readwrite', st => st.delete(id)); } catch(e){} return this.list(); },
    cached(){ return cache; }
  };
})();

/* =====================================================================
   6. MISSION ENGINE – Zustandsmaschine mit genau EINEM Takt
   Die Mission wird beim Start in eine lineare Zeitleiste übersetzt.
   Jede Phase kennt nur ihre Endzeit: keine Timer pro Phase,
   daher keine doppelten Intervalle und keine veralteten Callbacks.
   ===================================================================== */
const PAUSE_HIGH = 90;   // Sets mit hoher Belastung: Pausen im Hauptteil nach jeder Übung 90 Sek.
function buildTimeline(m){
  const T = [], hi = m.load === 'hoch';
  let proIdx = 0;
  const nextPro = () => PROS[proIdx++ % PROS.length];
  const brkPhase = (b, sec, si, r, rounds, pro) => ({
    type:'BREAK', breakType:b.type, dur: hi && sec.type === 'main' ? PAUSE_HIGH : b.type === 'water' ? Math.min(b.duration, 10) : b.duration,
    sec, si, round:r, rounds, pro: pro ? nextPro() : null
  });
  T.push({ type:'MISSION_COUNTDOWN', dur:4 });
  m.sections.forEach((sec, si) => {
    T.push({ type:'SECTION_INTRO', dur:sec.tip ? 6 : 4, sec, si });
    sec.blocks.forEach((b, bi) => {
      for (let r = 1; r <= b.repeat; r++){
        b.steps.forEach(st => {
          if (st.kind === 'exercise'){
            const ex = Object.assign({}, EXERCISES[st.ex], st.o || {});
            const base = { sec, si, exId:ex.anim || st.ex, ex, round:r, rounds:b.repeat, pause: b.between ? (hi && sec.type === 'main' ? PAUSE_HIGH : b.between.duration) : 0 };
            if (r === 1 || !b.between) T.push({ ...base, type:'EXERCISE_PREVIEW', dur: r === 1 ? m.previewSeconds : m.previewRepeatSeconds });   // ab Durchgang 2 zeigt die Pause schon die nächste Übung
            T.push({ ...base, type:'EXERCISE_COUNTDOWN', dur: m.countdownSeconds });
            T.push({ ...base, type:'EXERCISE_RUNNING',   dur: st.duration });
          } else T.push(brkPhase(st, sec, si, r, b.repeat, false));
        });
        if (r < b.repeat && b.between) T.push(brkPhase(b.between, sec, si, r, b.repeat, false));
      }
      // nach jedem Übungsblock im Hauptteil: Trinkpause mit NHL-Profikarte
      if (b.proAfter && bi < sec.blocks.length - 1) T.push(brkPhase({ type:'water', duration:10 }, sec, si, b.repeat, b.repeat, true));
    });
    T.push({ type:'SECTION_COMPLETE', dur:8, sec, si, pro:nextPro() });
  });
  T.push({ type:'MISSION_COMPLETE', dur:3 });
  let acc = 0;
  T.forEach(p => { p.start = acc; acc += p.dur; });
  T.total = acc;
  return T;
}

const Engine = {
  T:null, i:-1, endsAt:0, left:0, active:false, paused:false, runId:0, awardedRun:-1, fired:new Set(),
  realMs(p){ return p.dur * 1000 / settings.speed; },
  start(){ this.T = buildTimeline(MISSION); this.startedAt = Date.now(); this.runId++; this.active = true; this.paused = false; this.skips = 0; this.skipSecs = new Set(); this.enter(0); },
  enter(i){
    this.i = i;
    const p = this.T[i];
    this.endsAt = performance.now() + this.realMs(p);
    this.fired = new Set();
    onPhaseEnter(p, i, this.T[i - 1]);
  },
  remaining(){ return this.paused ? this.left : this.endsAt - performance.now(); },
  pause(){ if (!this.active || this.paused) return; this.left = this.endsAt - performance.now(); this.paused = true; },
  resume(){ if (!this.active || !this.paused) return; this.endsAt = performance.now() + this.left; this.paused = false; },
  skip(){
    if (!this.active) return;
    const cur = this.T[this.i], t = cur.type;
    if (t.indexOf('EXERCISE_') === 0){ this.skips++; this.skipSecs.add(cur.sec.id); }
    let j = this.i + 1;
    if (t === 'EXERCISE_PREVIEW') j = this.i + 3;
    else if (t === 'EXERCISE_COUNTDOWN') j = this.i + 2;
    this.paused = false;
    this.enter(Math.min(j, this.T.length - 1));
  },
  stop(){ this.active = false; this.paused = false; this.i = -1; },
  once(key, fn){ if (!this.fired.has(key)){ this.fired.add(key); fn(); } },
  tick(){
    if (!this.active || this.paused) return;
    const p = this.T[this.i];
    const leftMs = this.remaining();
    onPhaseTick(p, Math.max(0, leftMs));
    if (leftMs <= 0){
      if (this.i < this.T.length - 1) this.enter(this.i + 1);
      else finishMission();
    }
  }
};
setInterval(() => Engine.tick(), 100);   // der einzige Takt der App

/* Ton-Wächter: weckt den Ton nach Unterbrechungen auf. Steht die Audio-Zeit still, ist die Engine «tot»
   und wird beim nächsten Tipp neu aufgebaut. Solange zeigt das Training einen Hinweis zum Antippen. */
let audioOffSince = 0, lastAudioT = -1, audioBroken = false;
setInterval(() => {
  const st = Sound.state(), want = settings.music || settings.sfx, t = Sound.time();
  if (Voice.mode() === 'hold'){ lastAudioT = -1; return; }   // Ton ist absichtlich angehalten, solange der Coach spricht
  if (st === 'none' || !want){ $('audio-hint').hidden = true; audioOffSince = 0; lastAudioT = -1; return; }
  const stalled = st === 'running' && lastAudioT >= 0 && Math.abs(t - lastAudioT) < 0.05;
  lastAudioT = t;
  if (st !== 'running' || stalled){ Sound.resume(); audioOffSince = audioOffSince || Date.now(); }
  else { audioOffSince = 0; audioBroken = false; }
  if (audioOffSince && Date.now() - audioOffSince > 1500) audioBroken = true;
  $('audio-hint').hidden = !(Engine.active && audioBroken);
  const d = $('audio-diag'); if (d) d.textContent = `Aufnahmen: ${Object.keys(clipData).length} gespeichert, ${Object.keys(clipBufs).length} geladen${clipErr ? ' (Fehler ' + clipErr + ')' : ''} · Coach ${settings.voice ? 'an' : 'aus'} · Ton: ${st}${stalled ? ' (steht still)' : ''} · Stimme: ${Voice.info()} · Verfügbar: ${Voice.voiceNames()}`;
  const vl = $('voice-log'); if (vl) vl.textContent = Voice.logText() || '–';
}, 500);
function fixAudio(){
  if (!settings.music && !Engine.active && curScreen !== 'test') return;   // «Eigene Musik»: in den Menüs Audio gar nicht anfassen
  if (Voice.mode() === 'hold'){ Voice.prime(); return; }     // Coach spricht gerade: Musik nicht dazwischen starten
  if (audioBroken){ audioBroken = false; audioOffSince = 0; lastAudioT = -1; Sound.rebuild(); Sound.setMode(currentMode()); }
  else Sound.unlock();
  Voice.prime();
}
function currentMode(){ return !Engine.active && MUSIC_SCREENS.has(curScreen) ? 'calm' : 'off'; }   // Musik auf den Menü-Ebenen

/* ---- Geräte (Props) für die Animationen ---- */
const f1 = v => v.toFixed(1);
const X = {
  mid:(a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2],
  cone:(x, c) => `<path class="p-cone ${c || 'red'}" d="M${f1(x - 7)} ${GROUND + 2} L${f1(x)} ${GROUND - 15} L${f1(x + 7)} ${GROUND + 2} Z"/>`,
  disc:x => `<ellipse class="p-cone yellow" cx="${f1(x)}" cy="${GROUND + 1}" rx="9" ry="3"/>`,
  scroll:(ph, speed, spacing, fn) => { let s = ''; const off = (ph * speed * spacing) % spacing;
    for (let x = 0; x < 240 + spacing; x += spacing) s += fn(x - off); return s; },
  wall:x => `<rect class="p-wall" x="${f1(x)}" y="40" width="12" height="${GROUND + 2 - 40}" rx="2"/>`,
  ball:(x, y, c, r) => `<circle class="p-ball ${c || 'tennis'}" cx="${f1(x)}" cy="${f1(y)}" r="${r || 6}"/>`,
  throwBall:(J, ph, wallX, c) => { const h = X.mid(J.lh, J.rh), w = wallX - 6; let x, y;
    if (ph < .5){ const k = ph / .5; x = h[0] + (w - h[0]) * k; y = h[1] - 28 * Math.sin(Math.PI * k); }
    else { const k = (ph - .5) / .5; x = w - (w - h[0]) * k; y = h[1] - 14 * Math.sin(Math.PI * k); }
    return X.ball(x, y, c); },
  mat:(x0, x1) => `<rect class="p-mat" x="${x0}" y="${GROUND - 1}" width="${x1 - x0}" height="5" rx="2"/>`,
  board:(cx, feetY, tilt) => { const r = Math.max(4, (GROUND + 2 - feetY - 6) / 2);
    return `<circle class="p-roller" cx="${f1(cx)}" cy="${f1(GROUND + 2 - r)}" r="${f1(r)}"/>` +
      `<rect class="p-board" x="${f1(cx - 54)}" y="${f1(feetY)}" width="108" height="6" rx="3" transform="rotate(${tilt.toFixed(2)} ${f1(cx)} ${f1(feetY + 3)})"/>`; },
  pods:(xs, lit) => xs.map((x, i) => `<ellipse class="p-pod${i === lit ? ' lit' : ''}" cx="${f1(x)}" cy="${GROUND}" rx="10" ry="4"/>`).join(''),

/* Weiche Bewegung: Catmull-Rom-Spline durch die Schlüsselposen.

function poseAt(def, ph){

      p[k] = b === c ? b : 0.5 * ((2 * b) + (-a + c) * f + (2 * a - 5 * b + 4 * c - d) * f2 + (-a + 3 * b - 3 * c + d) * f3);

    // wie ein Mensch am Umkehrpunkt – schnelle Lauf- und Sprungzyklen bleiben fliessend.
    if (def.period >= 1.8 && !def.linear){

      if (Math.abs(g) > 1e-4) for (const k in p){ const b = p1[k], c = p2[k]; if (b !== c && typeof b === 'number') p[k] += (c - b) * g; }
    }

  return p;
}

/* Hinweise nach Jugend-Richtlinien: kein hartes Set vor Spielen, nicht zweimal hart hintereinander, Ruhetag */
function weekWarnings(W){
  W = W || week;
  const out = [], setOf = k => SETS.find(m => m.id === W[k].set);
  DAYS.forEach(([k, name], i) => {
    const d = W[k], m = setOf(k), next = W[DAYS[(i + 1) % 7][0]], prev = W[DAYS[(i + 6) % 7][0]], pm = setOf(DAYS[(i + 6) % 7][0]);
    if (m && m.load === 'hoch' && isGame(next)) out.push(`${name}: Set mit hoher Belastung am Tag vor einem Spiel – besser ein lockeres Set wählen.`);
    if (m && m.load === 'hoch' && isGame(d)) out.push(`${name}: Spieltag – kein Set mit hoher Belastung.`);
    if (m && pm && m.load === 'hoch' && pm.load === 'hoch') out.push(`${name}: zwei Sets mit hoher Belastung an aufeinanderfolgenden Tagen.`);
    if (m && m.load === 'hoch' && isGame(prev)) out.push(`${name}: Tag nach dem Spiel – Erholung oder lockeres Set ist besser.`);
  });
  const sets = DAYS.filter(([k]) => W[k].set).length;
  const busy = DAYS.filter(([k]) => W[k].set || W[k].ice || isGame(W[k])).length;
  if (sets > 3) out.push(`${sets} APC-Sets pro Woche – neben dem Eistraining sind 2 bis 3 genug.`);

/* Vorschlag: 2–3 Sets auf freie Tage, Belastung passend zu Eistraining und Spielen */
function suggestWeek(W, save){
  W = W || week;
  if (!DAYS.some(([k]) => W[k].ice)) CLUB_DEFAULT.forEach(k => { W[k].ice = true; W[k].offIce = true; });   // ohne Eistage: Standard Di, Mi, Fr
  DAYS.forEach(([k]) => { W[k].set = ''; });
  const log = progress.log || [];
  const lastIdx = log.length ? MISSIONS.findIndex(m => m.id === log.reduce((x, e) => Date.parse(e.at) > Date.parse(x.at) ? e : x, log[0]).mission) : -1;
  let ptr = (lastIdx + 1) % MISSIONS.length;
  const take = ok => { for (let n = 0; n < MISSIONS.length; n++){ const m = MISSIONS[(ptr + n) % MISSIONS.length]; if (!isLocked(m) && ok(m)){ ptr = (ptr + n + 1) % MISSIONS.length; return m; } } return null; };
  const score = i => { const k = DAYS[i][0], d = W[k]; if (isGame(d)) return -1;
    const next = W[DAYS[(i + 1) % 7][0]], prev = W[DAYS[(i + 6) % 7][0]];
    return (d.ice ? 1 : 3) + (isGame(next) ? -1 : 0) + (isGame(prev) ? -1 : 0); };
  const free = DAYS.map((_, i) => i).filter(i => score(i) >= 0).sort((a, b) => score(b) - score(a));
  const iceDays = DAYS.filter(([k]) => W[k].ice).length, target = iceDays >= 4 ? 2 : 3;
  const chosen = [];
  free.forEach(i => { if (chosen.length < target && !chosen.some(j => Math.abs(j - i) === 1 || Math.abs(j - i) === 6)) chosen.push(i); });
  free.forEach(i => { if (chosen.length < target && chosen.indexOf(i) < 0) chosen.push(i); });
  chosen.sort((a, b) => a - b).forEach(i => {
    const k = DAYS[i][0], next = W[DAYS[(i + 1) % 7][0]], prev = W[DAYS[(i + 6) % 7][0]];
    const prevSet = SETS.find(m => m.id === W[DAYS[(i + 6) % 7][0]].set);
    const allowHigh = !isGame(next) && !isGame(prev) && !(prevSet && prevSet.load === 'hoch') && !W[k].ice;
    const m = take(x => allowHigh || x.load !== 'hoch');
    if (m) W[k].set = m.id;
  });
  (save || saveWeek)();
}

/* ---- Logbuch: Monatskalender und Liste aller Trainings ---- */
let logMonth = null;
function openLog(ym){
  Voice.stop();
  const now = new Date(), log = (progress.log || []).slice().sort((a, b) => Date.parse(b.at) - Date.parse(a.at));
  logMonth = ym || logMonth || { y:now.getFullYear(), m:now.getMonth() };
  const { y, m } = logMonth, first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
  const inMonth = log.filter(e => { const d = new Date(e.at); return d.getFullYear() === y && d.getMonth() === m; });
  const byDay = {}; inMonth.forEach(e => { const d = new Date(e.at).getDate(); (byDay[d] = byDay[d] || []).push(e); });
  const weekStartNow = weekStart(now.toISOString()), todayStr = now.toDateString();
  const lead = (first.getDay() + 6) % 7, cells = [];
  for (let i = 0; i < lead; i++) cells.push('<div class="lg-day empty" aria-hidden="true"></div>');
  for (let d = 1; d <= days; d++){
    const dt = new Date(y, m, d), plan = dt.getTime() >= weekStartNow ? planFor(dt) : null;   // Wochenplan (mit Abweichungen) nur ab dieser Woche
    const done = byDay[d], cls = ['lg-day'];
    if (dt.toDateString() === todayStr) cls.push('today');
    if (dt > now && dt.toDateString() !== todayStr) cls.push('future');
    if (plan && isGame(plan)) cls.push('game'); else if (plan && plan.ice) cls.push('ice');
    if (done) cls.push('done');
    const sets = done ? done.map(e => { const ms = SETS.find(x => x.id === e.mission); return ms ? 'Set ' + ms.n : '?'; }) : [];
    const label = `${d}. ${DAYS[(dt.getDay() + 6) % 7][1]}${done ? ': ' + sets.join(', ') : ''}${plan && isGame(plan) ? ', Spiel geplant' : plan && plan.ice ? ', Eistraining geplant' : ''}`;
    cells.push(`<div class="${cls.join(' ')}" aria-label="${label}"><span>${d}</span>${done ? `<b>${done.length > 1 ? done.length + '×' : sets[0].replace('Set ', 'S')}</b>` : ''}</div>`);
  }
  const mins = inMonth.reduce((a, e) => { const ms = SETS.find(x => x.id === e.mission); return a + (e.dur || (ms ? fmtMin(buildTimeline(ms).total) : 0)); }, 0);
  const weeksInMonth = Math.max(1, Math.min(days, (y === now.getFullYear() && m === now.getMonth() ? now.getDate() : days)) / 7);
  const isCur = y === now.getFullYear() && m === now.getMonth();
  const oldest = log.length ? new Date(log[log.length - 1].at) : now;
  const canPrev = new Date(y, m, 1) > new Date(oldest.getFullYear(), oldest.getMonth(), 1);
  const monthName = first.toLocaleDateString('de-CH', { month:'long', year:'numeric' });
  const rows = inMonth.map(e => {
    const ms = SETS.find(x => x.id === e.mission), d = new Date(e.at);
    const st = e.skips ? `${e.skips} ${e.skips === 1 ? 'Übung' : 'Übungen'} übersprungen` : 'Vollständig';
    const dur = e.dur ? e.dur + ' Min' : ms ? '≈ ' + fmtMin(buildTimeline(ms).total) + ' Min' : '–';
    return `<div class="lg-row">
      <span class="lg-d">${d.toLocaleDateString('de-CH', { weekday:'short', day:'2-digit', month:'2-digit' })}<small>${d.toLocaleTimeString('de-CH', { hour:'2-digit', minute:'2-digit' })} Uhr</small></span>
      <span><b>${ms ? 'Set ' + ms.n + ' · ' + ms.title : e.mission}</b>${e.elite ? '<small>Elite-Version</small>' : ''}</span>
      <span>${dur}</span>
      <span class="st ${e.skips || e.mainDone === false ? 'warn' : 'ok'}">${st}${e.mainDone === false ? '<small>Hauptteil nicht komplett</small>' : ''}</span>
    </div>`;
  }).join('');
  $('screen-log').innerHTML = `
  <div class="inner trophies hub">
    <div class="tr-head"><div><p class="eyebrow">Fortschritt</p><h1>Logbuch</h1></div>
      <button class="btn btn-ghost btn-small" id="btn-log-back"><span class="arrow back" aria-hidden="true"></span> Fortschritt</button></div>
    <div class="lg-stats">
      <div class="stat"><small>Trainings</small><b>${inMonth.length}</b></div>
      <div class="stat"><small>Minuten</small><b>${mins}</b></div>
      <div class="stat"><small>Ø pro Woche</small><b>${(inMonth.length / weeksInMonth).toFixed(1).replace('.', ',')}</b></div>
    </div>
    <section class="lg-cal" aria-label="Kalender ${monthName}">
      <div class="lg-head"><h2>${monthName}</h2>
        <div class="lg-nav"><button id="lg-prev" aria-label="Vorheriger Monat" ${canPrev ? '' : 'disabled'}>‹</button><button id="lg-next" aria-label="Nächster Monat" ${isCur ? 'disabled' : ''}>›</button></div></div>
      <div class="lg-dow" aria-hidden="true">${DAYS.map(d => `<span>${d[2].toUpperCase()}</span>`).join('')}</div>
      <div class="lg-grid">${cells.join('')}</div>
      <div class="lg-legend"><span><i style="background:#123A2C;border:2px solid var(--ok)"></i>APC-Training (Set-Nummer)</span><span><i style="background:var(--blue)"></i>Eistraining geplant</span><span><i style="background:var(--red)"></i>Match / Turnier geplant</span></div>
    </section>
    <h3 class="ms-h">Alle Trainings im ${first.toLocaleDateString('de-CH', { month:'long' })}</h3>
    <div class="lg-list">${rows || '<p class="lg-empty">In diesem Monat noch kein Training. Abgebrochene Trainings und Testläufe werden nicht gespeichert.</p>'}</div>
  </div>`;
  $('btn-log-back').onclick = openProgress;
  $('lg-prev').onclick = () => { const d = new Date(y, m - 1, 1); openLog({ y:d.getFullYear(), m:d.getMonth() }); };
  $('lg-next').onclick = () => { const d = new Date(y, m + 1, 1); openLog({ y:d.getFullYear(), m:d.getMonth() }); };
  const sc = $('screen-log'), keep = !!ym; show('log'); if (keep) sc.scrollTop = 0;
}
