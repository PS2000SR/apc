/* ---- Konfetti ---- */
function confetti(){
  if (REDUCED) return;
  const cv = $('confetti'), cx = cv.getContext('2d'); if (!cx) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--ice','--red','--blue','--text'].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({ length:140 }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .55,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 16 - 6,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .4,
    w: 4 + Math.random() * 10, h: 3 + Math.random() * 3, c: pick(cols)
  }));
  const t0 = performance.now();
  (function frame(t){
    const age = t - t0;
    cx.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(q => {
      q.vy += 0.42; q.vx *= 0.99; q.x += q.vx; q.y += q.vy; q.r += q.vr;
      cx.save(); cx.globalAlpha = Math.max(0, 1 - age / 2600); cx.translate(q.x, q.y); cx.rotate(q.r);
      cx.fillStyle = q.c; cx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h); cx.restore();
    });
    if (age < 2600) requestAnimationFrame(frame); else cx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

/* ---- Demomodus: Rundgang (3 Sekunden je Station) mit Beispieldaten. Während der Demo wird nichts gespeichert,
   danach sind die echten Daten wieder da (auch wenn die App mittendrin geschlossen wird). ---- */
const Demo = (() => {
  const PER = 3000;   // 3 Sekunden je Station
  let timers = [], saved = null, origSet = null, layer = null;
  const iso = d => new Date(Date.now() - d * 864e5).toISOString();
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const tap = (sel, ms) => later(() => { const b = document.querySelector(sel); if (b) b.dispatchEvent(new MouseEvent('click', { bubbles:true })); }, ms);
  const hl = sel => later(() => { document.querySelectorAll('.demo-hl').forEach(x => x.classList.remove('demo-hl')); const el = document.querySelector(sel); if (el){ el.classList.add('demo-hl'); el.scrollIntoView({ block:'center', behavior:'smooth' }); } }, 300);
  const closeFb = () => document.querySelectorAll('.fbk').forEach(x => x.remove());
  function demoData(){
    const ids = MISSIONS.filter(m => !isLocked(m)).map(m => m.id), days = [33,31,28,26,24,21,19,17,14,12,10,7,5,3,1];
    const ST = [2,3,4,3,5,2,3,4,3,4,2,3,5,3,4], FN = [3,2,3,3,2,3,1,3,3,2,3,3,2,3,3];
    const log = days.map((d, k) => ({ at:iso(d), mission:ids[k % ids.length], skips:0, mainDone:true, dur:25,
      fb:Object.assign({ strain:ST[k], fun:FN[k] }, d === 10 ? { pain:[{ area:'knie-l', level:'leicht' }] } : {}) }));
    return { xp:1340, completed:log.length, last:log[log.length - 1].at, log, prCount:3, titles:0, quests:{}, weekBonus:{}, season:null,
      badges:Object.fromEntries(BADGES.slice(0, 6).map(b => [b.id, iso(20)])), cards:[0, 1, 2, 3, 4, 5, 6],
      records:{ sprint10:[{ v:2.31, at:iso(30), src:'test' }, { v:2.18, at:iso(2), src:'test' }], standweit:[{ v:168, at:iso(30), src:'test' }, { v:181, at:iso(2), src:'test' }], plank:[{ v:65, at:iso(30), src:'test' }, { v:90, at:iso(2), src:'test' }] },
      tests:[{ at:iso(30), values:{ sprint10:2.31, standweit:168, plank:65 } }, { at:iso(2), values:{ sprint10:2.18, standweit:181, plank:90 } }],
      pain:[{ at:iso(10), area:'knie-l', level:'leicht', src:'training' }] };
  }
  const STEPS = [
    ['Mission Center: Matteo sagt, wie er sich fühlt – der Coach schlägt das passende Training vor.', () => { renderCenter(); show('center'); hl('.mc2-feels'); }],
    ['Das empfohlene Training mit Dauer, Belastung und XP – plus Wochenziel und Tages-Quest.', () => hl('.mc2-rec')],
    ['Alle Trainings im Überblick, sortiert nach Schwerpunkt.', () => openMissions()],
    ['Vor dem Start: jede Übung wird mit einer Animation erklärt.', () => openBriefing(renderCenter.rec ? renderCenter.rec.id : MISSIONS[0].id)],
    ['Nach dem Training: Wie streng war\'s? Wie viel Spass hat\'s gemacht?', () => { show('center'); feedbackFlow({ steps:['strain', 'fun', 'pain'], training:true, title:'Wie war\'s?', onDone:() => {} }); tap('.fbk [data-v="4"]', 1300); }],
    ['Tut etwas weh? Matteo tippt die Stelle direkt am Körper an.', () => { feedbackFlow({ steps:['area', 'level'], title:'Wie war\'s?', preset:{ sel:['knie-l'] }, onDone:() => {} }); tap('.fbk path[data-area="schulter-r"]', 1200); }],
    ['Fortschritt: Rang, Level und Saison auf einen Blick.', () => { closeFb(); openProgress(); }],
    ['Die eigene Spielerkarte mit Attributen und Avatar.', () => openCard()],
    ['Belohnungen: NHL-Profikarten und Abzeichen.', () => openTrophies()],
    ['Analytics: Belastung, Spass und Schmerzen ausgewertet.', () => { openAnalytics(); later(() => { const sc = $('screen-analytics'); if (sc) sc.scrollTo({ top:520, behavior:'smooth' }); }, 1200); }],
    ['Rekorde und Testtag zeigen, wie Matteo besser wird.', () => openRecords()],
    ['Eltern-Bereich: Wochenplan mit Eistraining und Matches, Sicherung und Freigaben.', () => openParents()]
  ];
  function start(){
    if (layer || Engine.active) return;
    saved = JSON.parse(JSON.stringify(progress)); origSet = store.set; store.set = () => {};
    Object.keys(progress).forEach(k => delete progress[k]); Object.assign(progress, demoData());
    layer = document.createElement('div'); layer.id = 'demo';
    layer.innerHTML = `<div class="d-cap" role="status" aria-live="polite"><div class="d-top"><span class="d-tag" id="d-tag">Demo</span>
      <button class="btn btn-ghost btn-small" id="d-stop">Demo beenden</button></div><p class="d-txt" id="d-txt"></p><div class="d-bar"><span id="d-bar"></span></div></div>`;
    document.body.appendChild(layer);
    $('d-stop').onclick = stop;
    const TOTAL = PER * STEPS.length, bar = $('d-bar'); requestAnimationFrame(() => { bar.style.transition = `width ${TOTAL}ms linear`; bar.style.width = '100%'; });
    STEPS.forEach(([txt, fn], k) => later(() => {
      $('d-tag').textContent = `Demo · ${k + 1}/${STEPS.length}`; $('d-txt').textContent = txt;
      document.querySelectorAll('.demo-hl').forEach(x => x.classList.remove('demo-hl'));
      try { fn(); } catch(e){}
    }, k * PER));
    later(stop, TOTAL);
  }
  function stop(){
    if (!layer) return;
    timers.forEach(clearTimeout); timers = [];
    closeFb(); document.querySelectorAll('.demo-hl').forEach(x => x.classList.remove('demo-hl'));
    Object.keys(progress).forEach(k => delete progress[k]); Object.assign(progress, saved);
    store.set = origSet; saved = null;
    layer.remove(); layer = null;
    openParents();
  }
  return { start, stop, active:() => !!layer };
})();
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('[data-demo]'); if (b) Demo.start(); });

if (settings.musicStyle === 'own'){ settings.musicStyle = 'track:face-off'; saveSettings(); }
// Generell Männerstimme: eine früher gewählte Frauenstimme zurücksetzen (automatische Wahl bevorzugt männliche Stimmen)
if (settings.voiceName && /(anna|helena|petra|katja|hedda|marlene|vicki|sandy|shelley|samantha|karen|moira|tessa|fiona|victoria|serena|kate|susan|zira)/i.test(settings.voiceName)){ settings.voiceName = ''; saveSettings(); }

// deshalb Startversuch sofort und spätestens beim ersten Tippen irgendwo in der App.
if (settings.musicAuto === undefined){ settings.musicAuto = true; }
settings.music = settings.sfx = settings.voice = false;   // Ton komplett aus (Apple Music/Spotify laufen ungestört)
applyMusicChoice(settings.musicStyle);
try { Sound.setMode('calm'); if (settings.music) Sound.unlock(); } catch(e){}
// iOS gibt Ton nur bei touchend/click frei (nicht bei pointerdown)
['touchend','click','keydown'].forEach(ev => document.addEventListener(ev, fixAudio, { capture:true, passive:true }));
syncToggles();
renderCenter();
show('center');
})();
